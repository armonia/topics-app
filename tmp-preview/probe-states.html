<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #111; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; margin: 0; padding: 28px; display: flex; gap: 20px; align-items: flex-start; }
  .card { background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 12px; width: 270px; padding: 18px; color: #e0e0e0; }
  .state-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; padding: 3px 8px; border-radius: 4px; display: inline-block; }
  .state-live { background: #14532d; color: #86efac; }
  .state-dead { background: #7f1d1d; color: #fca5a5; }
  .state-unknown { background: #1e2040; color: #a5b4fc; }
  .card-title { font-size: 13px; font-weight: 600; color: #f0f0f0; margin-bottom: 14px; line-height: 1.4; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #1e3a5f; color: #60a5fa; border: 1px solid #2563eb44; margin-bottom: 14px; }
  .divider { height: 1px; background: #2a2a2a; margin: 10px 0 14px; }
  .link-live { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; background: #14532d; border: 1px solid #16a34a55; border-radius: 7px; font-size: 12px; color: #4ade80; text-decoration: none; width: 100%; box-sizing: border-box; }
  .alert-dead { background: #2d1515; border: 1px solid #7f1d1d44; border-radius: 8px; padding: 10px 13px; display: flex; align-items: flex-start; gap: 9px; }
  .alert-dead .ico { color: #f87171; font-size: 15px; flex-shrink: 0; }
  .alert-dead .txt { font-size: 12px; color: #fca5a5; line-height: 1.45; }
  .alert-dead .url-txt { font-size: 11px; color: #f87171; opacity: 0.75; margin-top: 4px; }
  .silence { font-size: 12px; color: #555; font-style: italic; padding: 6px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="state-label state-live">live</div>
  <div class="card-title">Auth flow redesign</div>
  <div class="badge">● in review</div>
  <div class="divider"></div>
  <a class="link-live">⬡ &nbsp; http://localhost:3405/ — apri anteprima</a>
</div>
<div class="card">
  <div class="state-label state-dead">dead</div>
  <div class="card-title">Auth flow redesign</div>
  <div class="badge">● in review</div>
  <div class="divider"></div>
  <div class="alert-dead">
    <div class="ico">⚠</div>
    <div>
      <div class="txt">Anteprima non raggiungibile: il server si è spento.</div>
      <div class="url-txt">http://localhost:3401/</div>
    </div>
  </div>
</div>
<div class="card">
  <div class="state-label state-unknown">unknown</div>
  <div class="card-title">Auth flow redesign</div>
  <div class="badge">● in review</div>
  <div class="divider"></div>
  <div class="silence">(sonda non ancora eseguita — silenzio)</div>
</div>
</body>
</html>
