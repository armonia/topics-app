name: Sidecar smoke

# The release ships a compiled server sidecar for macOS, Windows and Linux, and
# until this job nothing started it before it reached users: CI only stubs the
# binaries for `cargo check`. Defect D1 of the cloud quality pass broke exactly
# that binary (the embedded migrations), on one Bun only. Each server change now
# compiles the sidecar on the three systems and runs it in isolation
# (`scripts/build-server-sidecar.sh smoke`: own port, data dir, home, no PTY bridge).

on:
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "scripts/build-server-sidecar.sh"
      - "scripts/gen-migrations-manifest.ts"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/sidecar-smoke.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "scripts/build-server-sidecar.sh"
      - "scripts/gen-migrations-manifest.ts"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/sidecar-smoke.yml"
  workflow_dispatch:

concurrency:
  group: sidecar-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile and start the sidecar in isolation
        shell: bash
        run: bash scripts/build-server-sidecar.sh smoke
