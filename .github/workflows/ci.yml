name: CI

# Quality gate on every push to main and every pull request: client typecheck,
# client lint, server parse-check, and the unit/integration suite.
#
# Why this exists: release.yml only runs on version tags, so before this nothing
# was typechecked or tested on merge — regressions (and a build-breaking tsconfig
# value) shipped silently. See AUDIT-2026-06-19.md, priority #3.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (node-pty native bridge used by server tests)
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install server deps (root)
        # node-pty's postinstall runs under Bun, whose bundled undici lacks
        # webidl.util.markAsUncloneable → the gyp build crashes ("is not a
        # function"). Skip install scripts here; node-pty is (re)built right
        # after via `npm rebuild` under real Node 20, which is unaffected. No
        # other root dep needs its install script in CI.
        run: bun install --frozen-lockfile --ignore-scripts

      # node-pty ships no Linux prebuild — rebuild against the runner's Node.
      - name: Rebuild node-pty (Linux)
        run: npm rebuild node-pty

      # `--ignore-scripts` qui sopra non salta solo i postinstall delle
      # dipendenze: salta anche quello della RADICE, che e'
      # `bun run scripts/fix-node-pty-exec-bit.ts`. E quel bit serve davvero: il
      # tarball di node-pty spedisce gli `spawn-helper` a 644 (verificato con
      # `npm pack`), nessuno script del pacchetto li chmoda, e `npm rebuild`
      # ricostruisce `build/Release` senza toccare i `prebuilds/`. Su questa
      # macchina sono 755 solo perche' il postinstall gira; sul runner no, e il
      # test «ogni spawn-helper di node-pty e' eseguibile» diventava rosso.
      - name: Rimetti il bit +x sugli spawn-helper (il postinstall e' stato saltato)
        run: bun run scripts/fix-node-pty-exec-bit.ts

      - name: Install client deps
        run: bun install --frozen-lockfile
        working-directory: client

      # Il terzo lockfile del repo. Root e client sono sorvegliati di fatto dai
      # due `bun install --frozen-lockfile` qui sopra; `landing/bun.lock` non lo
      # toccava NIENTE, perché nessun workflow builda il sito (il deploy è
      # manuale: `bun run deploy:landing` → build:site + wrangler). Una deriva lì
      # non rompeva la CI, rompeva il deploy del sito, cioè si scopriva tardi e
      # altrove. `--dry-run` risolve e confronta senza installare l'albero — è il
      # passo più economico che esista e fallisce lo stesso con «lockfile had
      # changes, but lockfile is frozen» (verificato: exit 1 con una dipendenza
      # aggiunta a mano a landing/package.json, exit 0 sull'albero allineato).
      - name: Lockfile del sito allineato (landing/)
        run: bun install --frozen-lockfile --dry-run
        working-directory: landing

      # `test:unit` contiene UN file che lancia un Chromium vero
      # (server/browser-dom-cobrowse.test.ts: rrweb va provato contro una pagina
      # con una CSP vera, non contro un finto). Senza questo passo quei sette
      # test cadono con «Chromium executable not found» — un rosso che in locale
      # non si vede mai, perché la macchina di sviluppo il browser ce l'ha.
      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      # All three projects in one step. Each `typecheck:*` script uses the
      # LOCALLY pinned tsc (5.9.3) — `bunx tsc` could fetch a newer major whose
      # deprecation handling differs and re-break the build gate.
      #
      # This also finally RUNS `typecheck:e2e`, which existed in package.json
      # for months without appearing in any workflow.
      - name: Typecheck (client + server ratchet + e2e)
        run: bun run typecheck

      - name: Lint client (eslint)
        run: bun run lint
        working-directory: client

      # Quattro cancelli che esistevano in package.json e non comparivano in
      # NESSUN workflow — la terza volta che questo repo trova la stessa cosa
      # (vedi `typecheck:e2e` sopra e `verify:phase30-strip` sotto). Uno script
      # di check che nessuno esegue non è una protezione: è la sua imitazione,
      # e costa di più di non averlo perché fa credere che la classe di difetti
      # sia coperta. Sono tutti puri e veloci, quindi stanno in un passo solo.
      #
      # Gli altri `check:*`/`lint:*` di package.json restano FUORI da qui, e
      # ognuno per un motivo che vale la pena scrivere (task b8092abe):
      #  · `lint:gherkin` (e i fratelli `tag:scenarios`, `uat`) — il codice sta
      #    in `spec-flow/`, che è in .gitignore:129: su un checkout di CI la
      #    cartella NON esiste, quindi il passo misurerebbe la presenza di un
      #    clone, non la qualità dei .feature. E di .feature ce ne sono zero:
      #    fino a questa modifica il comando rispondeva «✓ 0 feature files:
      #    tagging OK», un verde che nessuno aveva guadagnato. Ora FALLISCE
      #    dicendo che non ha niente da controllare (guardia in package.json,
      #    non nel clone ignorato, dove la modifica sarebbe deriva invisibile);
      #    quando tornerà un .feature ricomincia a mordere davvero — provato:
      #    con un file taggato male esce 1 elencando le tre violazioni.
      #  · `check:lockfile` — è la versione «una botta sola» per l'umano (root,
      #    client, landing). In CI gli stessi tre lockfile sono già coperti dai
      #    due install qui sopra più il passo `landing/` dedicato, senza pagare
      #    un terzo `bun install` completo.
      #  · `check:contrast`, `check:field`, `check:painted`, `check:landing`,
      #    `check:copy` — girano su `landing/dist`, cioè su un sito GIÀ
      #    costruito che nessun workflow costruisce: vivono nel deploy manuale
      #    del sito, non nella CI dell'app.
      #
      # Un altro si chiamava `check:*` e non lo era (l'ordinale stava qui e si è
      # scollato al primo cancello aggiunto, quindi ora non c'è): `check:landed`, ora
      # `report:landed` (scripts/check-done-landed.ts). Non misura il codice ma
      # lo STATO DELLA BOARD — legge `tasks`/`task_comments`/`messages` da
      # `data/topics.db`, che è in .gitignore:174. Su un checkout di CI quel
      # file non esiste e lo script esce **2** senza guardare niente, quindi
      # come passo sarebbe rosso per sempre; e i checkout che ispeziona
      # arrivano anche da altri progetti (`~/.openclaw/workspace`), quindi il
      # suo rosso può venire da un ramo di un repo che non è questo — il 13/08,
      # 2 dei 4 debiti stavano in altri due repo della postazione, e si vedono
      # con `bun run report:landed --json`. Il prefisso `check:`
      # era l'unica cosa che lo faceva sembrare una barra da tenere verde: sta
      # con `report:disk` e `report:branches`, che è quello che è. Non
      # aggiungerlo qui.
      - name: Static guard rails (any / NUL / dead code / eslint-disable / test skip / long dash / bloat)
        run: |
          bun run check:any
          bun run check:nul
          bun run check:deadcode
          bun run check:eslint-disable
          bun run check:test-skips
          bun run check:emdash
          bun run check:bloat

      # `check:bloat` è il settimo di questa fila ed è il rovescio di
      # `check:deadcode`: knip copre il codice che NESSUNO chiama, questo copre
      # il codice che chiamano tutti e che sta tutto nello stesso file. Misura
      # due cose e le confronta con `scripts/bloat-baseline.json`: righe per file
      # e blocchi duplicati. È un RATCHET, non una barra assoluta. Su questo
      # albero 93 file sono già oltre le 800 righe, quindi una barra assoluta
      # nascerebbe rossa e verrebbe spenta in una settimana. Diventa rosso quando
      # un file NUOVO passa la soglia, quando uno già censito cresce oltre il
      # suo tetto, o quando la duplicazione totale sale.
      #
      # Sta qui e non fra i referti perché non guarda né il database né la
      # macchina: legge `git ls-files` e i file, come gli altri sette.

      # `check:sicurezza` risponde a una domanda sola: questo checkout si può
      # pubblicare? Il repo è PUBBLICO, e i quattro modi di sbagliare erano
      # sorvegliati da tre parti diverse più la memoria di chi committava. Ora
      # sono un comando.
      #
      # QUI NE GIRANO DUE SU QUATTRO, e il perché è nella natura degli altri
      # due. `dati` e `home` cercano il nome e il percorso di casa di CHI
      # COMMITTA, e li DERIVANO dalla macchina (`id -F`, `git config user.name`,
      # `homedir()`) proprio per non doverli scrivere dentro un repo pubblico.
      # Un runner di GitHub non ha un'identità da proteggere: il suo account si
      # chiama `runner`, che non è il nome di nessuno ma compare in decine di
      # file tracciati. Eseguirli qui non misurerebbe una fuga, misurerebbe come
      # si chiama l'utente della macchina di build. Quei due pezzi mordono dove
      # il commit nasce davvero: sulla postazione, dove `bun run
      # check:sicurezza` li lancia tutti e quattro, e nei check pre-review, che
      # eseguono `test:unit` nel worktree dell'agente.
      #
      # `segreti` e `dipendenze` invece non dipendono da chi è alla tastiera:
      # cercano chiavi in chiaro nei file tracciati (forme di chiave, entropia,
      # `.env` tracciati) e confrontano `bun audit` con
      # `scripts/sicurezza-baseline.json`. Entrambi sono veloci e senza bundle,
      # quindi stanno fra i guard rails. `dipendenze` è l'unico passo di questa
      # fila che tocca la rete: senza registro non stampa verde, esce 2.
      - name: Il checkout è pubblicabile (segreti in chiaro, avvisi sulle dipendenze)
        run: bun run check:sicurezza --only=segreti,dipendenze

      # `check:deadcode` dice «zero export morti». Non dice su quanti file
      # l'ha guardato, e la differenza non era teorica: su `client/src/lib/api.ts`
      # — 49 export, la superficie HTTP del client — non poteva vedere niente,
      # perché un `import('../../lib/api').then(…)` altrove lo rendeva OPACO per
      # knip (che, non sapendo quali membri leggi, li considera usati tutti). Nove
      # export morti stavano lì da mesi con il cancello verde. In tutto i file
      # ciechi erano 41 su 801, e nessuno di loro compariva da nessuna parte.
      #
      # Questo passo appende un export morto-per-costruzione a ogni file di
      # progetto non-entrypoint, lancia knip UNA volta e pretende che ogni sonda
      # torni nel report. Sta in un passo suo per due motivi: costa una run di
      # knip (~1 min), e mentre gira l'albero è modificato — quindi non deve
      # incrociare altri check. I file vengono rimessi a posto in `finally`; su
      # un checkout di CI, comunque usa-e-getta, il danno massimo di un crash è
      # zero.
      - name: Il cancello sul codice morto non è cieco su nessun file
        run: bun run check:deadcode-blindspots

      # Il prefisso di una migration non è una scelta libera di chi scrive il
      # file. Col contatore due card in parallelo se lo prendevano uguale senza
      # potersene accorgere: il numero si sceglie alla NASCITA e si verifica
      # all'ATTERRAGGIO, e in mezzo atterrano gli altri (il 10/08 due `089`;
      # l'11-12/08 altre tre di fila, 097 100 101). Da qui in avanti il prefisso
      # è un timestamp UTC che nessuno deve contendere a nessuno
      # (`bun run migration:new`), e questo cancello ferma sia chi torna al
      # contatore sia i contatori duplicati rimasti.
      #
      # `fetch-depth` di default è 1, quindi `main` NON esiste in questo
      # checkout: senza il fetch mirato il cancello non avrebbe con cosa
      # confrontarsi (e uscirebbe 1 dicendolo, invece di passare a vuoto).
      #
      # IL `+` NON È DECORATIVO. `actions/checkout` punta già
      # `refs/remotes/origin/main` al commit in prova; se fra il checkout e
      # questa riga qualcun altro pusha, `main` è avanzato e un fetch NON forzato
      # viene RIFIUTATO — `! [rejected] main -> origin/main (non-fast-forward)`,
      # uscita 1. La shell di default è `bash -e`, quindi il passo muore lì e
      # tutti quelli dopo (test unitari, bundle, rotte, fluido, inchiostro)
      # vengono SALTATI. Con `--depth=1` il rifiuto è garantito: il commit
      # innestato non ha storia, quindi git non può dimostrare la discendenza.
      # Su un repo dove pushano dodici agenti quella finestra si becca di
      # continuo: rosso il 2026-08-14 su due push di fila, e non per una
      # migration sbagliata. Riprodotto in un repo usa-e-getta, non dedotto.
      #
      # LIMITE NOTO, scritto perché nessuno lo scopra di nuovo da capo: su un
      # evento `push` questo passo non misura niente. La base che `checkout`
      # lascia È il commit in prova, quindi il cancello confronta HEAD con sé
      # stesso e non può che passare. Il lavoro vero lo fa sulle pull request,
      # dove la base è un altro commit. Per renderlo reale anche sui push serve
      # `github.event.before` come base (e la guardia per il caso in cui sia
      # tutto zeri, cioè force-push o ramo nuovo): è un cambio più grosso di
      # questa riga e va fatto guardando, non di corsa.
      - name: Le migration nuove usano il timestamp, e nessun numero è doppio
        run: |
          git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
          MIGRATION_BASE_REF=refs/remotes/origin/main bun run check:migrations

      - name: Unit + integration tests
        run: bun test:unit

      # Guards a real production contract: the dev-only pane mutation log must
      # never reach the shipped bundle. The script has existed since phase 30
      # and, like typecheck:e2e, had never been wired to a workflow — so the
      # contract was only ever checked by hand.
      - name: Verify dev overlay stripped from the production bundle
        run: bun run verify:phase30-strip

      # Reuses the bundle `verify:phase30-strip` just built — no second build.
      # Bundle size was the one quality metric with no ratchet under it, and it
      # drifted ~3 KB on the eager entry in a single day with nobody noticing.
      - name: Bundle size budget
        run: bun run check:bundle

      # Le LATENZE delle rotte calde, contro una baseline dichiarata: stesso
      # mestiere di `check:bundle`, altro asse. Gira dopo la suite perche' vuole
      # un server suo (banda 15200-15299, DB in /tmp buttato via alla fine) e
      # perche' su una macchina occupata la misura non vale: se il runner e'
      # carico il banco esce 2 («non misurabile») invece di inventare un rosso,
      # e un 2 qui non ferma la pipeline.
      - name: Route latency budget
        run: bun run check:rotte || test $? -eq 2

      # I FRAME PERSI scorrendo il trascritto di una chat. Vuole il bundle e il
      # banco e2e, come `check:rotte`, e come lui tollera l'uscita 2: quella
      # dice «misura non utilizzabile» (la macchina non consegna frame nemmeno
      # su una pagina vuota, o il banco non ha scorso niente), e un rosso preso
      # su una misura che non vale e' il modo piu' rapido per far disattivare un
      # cancello.
      - name: Scroll fluidity budget
        run: bun run check:fluido || test $? -eq 2

      # CLICK -> INK: the milliseconds between the gesture and the first frame
      # that has PAINTED the answer, on the three most frequent gestures. The
      # budget and the probe existed already, but NO workflow invoked them: the
      # spec ran inside the E2E shards and measured, while the comparison against
      # `tests/e2e/ink-budget.json` is done only by this script, which was not in
      # the pipeline. A budget nobody executes is not a gate.
      #
      # It does not tolerate exit 2 the way the two above do, because it has no
      # such exit: it either measures or fails. The margin absorbs the gap
      # between this runner and an Apple laptop: a 100 ms median budget against
      # 13-23 ms measured, so 4x to 8x of headroom, and a 250 ms ceiling on any
      # single sample against roughly 23. If it ever turns noisy, the right
      # answer is to give it the exit 2 of its siblings ("not measurable on this
      # machine"), not to raise the threshold: raising it would switch the gate
      # off while leaving it green.
      #
      # Reuses the bundle built by `verify:phase30-strip`, like check:bundle.
      - name: Click-to-ink budget
        run: bun run check:ink

  # Runs the real E2E suite against the isolated server that globalSetup spawns
  # on :13334 (own SQLite DB under /tmp/topics-test-data) — no external
  # services or repo secrets needed: NO_TLS=1 and dummy GATEWAY_TOKEN/URL
  # values are set by global-setup.ts / start-test-server.sh themselves.
  # Previously this suite was only *collected* (`playwright test --list`) in
  # the check job above, which parses every spec but runs none of them.
  e2e:
    runs-on: ubuntu-latest
    # PR gate tier (E2E_TIER=pr): fast, deterministic subset, sharded across
    # parallel runners. The heavy/flaky/perf specs run in e2e-nightly.yml.
    #
    # NON-BLOCKING (continue-on-error) for now: the suite shares one test DB
    # across tests with no per-test reset (global-setup wipes once per run), so
    # accumulated state leaks between tests and sharding re-partitions surface a
    # different order-dependent failure each run — pre-existing debt, not a
    # regression of any one PR. Runs for signal + report; `check` and `tauri`
    # are the blocking gates. TODO(e2e-isolation): add per-test DB reset, then
    # drop continue-on-error to make this a hard gate again.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (node-pty native bridge used by the server)
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install server deps (root)
        # node-pty's postinstall runs under Bun, whose bundled undici lacks
        # webidl.util.markAsUncloneable → the gyp build crashes ("is not a
        # function"). Skip install scripts here; node-pty is (re)built right
        # after via `npm rebuild` under real Node 20, which is unaffected. No
        # other root dep needs its install script in CI.
        run: bun install --frozen-lockfile --ignore-scripts

      # node-pty ships no Linux prebuild — rebuild against the runner's Node.
      - name: Rebuild node-pty (Linux)
        run: npm rebuild node-pty

      # `--ignore-scripts` qui sopra non salta solo i postinstall delle
      # dipendenze: salta anche quello della RADICE, che e'
      # `bun run scripts/fix-node-pty-exec-bit.ts`. E quel bit serve davvero: il
      # tarball di node-pty spedisce gli `spawn-helper` a 644 (verificato con
      # `npm pack`), nessuno script del pacchetto li chmoda, e `npm rebuild`
      # ricostruisce `build/Release` senza toccare i `prebuilds/`. Su questa
      # macchina sono 755 solo perche' il postinstall gira; sul runner no, e il
      # test «ogni spawn-helper di node-pty e' eseguibile» diventava rosso.
      - name: Rimetti il bit +x sugli spawn-helper (il postinstall e' stato saltato)
        run: bun run scripts/fix-node-pty-exec-bit.ts

      - name: Install client deps
        run: bun install --frozen-lockfile
        working-directory: client

      # The isolated test server serves the client from public/ — without a
      # build it 404s on every route.
      - name: Build client
        run: bun run build:client

      - name: Install Playwright browsers (Chromium)
        run: npx playwright install --with-deps chromium

      # global-setup.ts and server/browser-service.ts auto-discover a cached
      # Chromium only under macOS's `~/Library/Caches/ms-playwright` layout,
      # so that lookup finds nothing on a Linux runner. Resolve the binary
      # actually installed above and hand it over via CHROMIUM_PATH, which
      # both files already check first, ahead of any OS-specific fallback.
      - name: Resolve Chromium path (Linux)
        id: chromium
        run: |
          # The headed binary lives at chromium-<rev>/chrome-linux/chrome —
          # depth 3 under ms-playwright, so -maxdepth 2 never reached it. The
          # -name chrome + chrome-linux path filter skips the headless_shell
          # sibling (chromium_headless_shell-<rev>/…/headless_shell).
          bin="$(find "$HOME/.cache/ms-playwright" -maxdepth 3 -type f -name chrome -path '*chrome-linux*' | sort -V | tail -1)"
          test -x "$bin"
          echo "path=$bin" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests (Playwright)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
          E2E_TIER: pr

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: test-results/html-report
          retention-days: 7

  # The Tauri shell is the primary desktop app (Electron was archived in v2.0.0,
  # recoverable on branch `electron-archive`). Its Rust crate compiles only on a
  # native toolchain, so `cargo check` it to catch Rust regressions on every
  # push/PR. It is the same gate the old Electron typecheck job provided.
  #
  # Le tre OS e non solo macOS. Il pane browser nativo ha un backend per motore
  # (WKWebView, WebView2, WebKitGTK) scelto da `cfg(target_os)`, e il compilatore
  # ne guarda uno solo: su un runner macOS i rami Windows e Linux non vengono
  # nemmeno letti. Con il solo job macOS quei due rami sono rimasti rotti senza
  # che nessuno lo vedesse: `on_page_load` chiamava helper macOS-only e non
  # compilava da nessuna delle due parti. Nessuno poteva accorgersene, perche
  # l'unica build cross-platform parte sui tag `tauri-v*`, cioe alla release. In locale lo stesso
  # controllo si fa con `scripts/check-cross-shell.sh`.
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # webkit2gtk-sys e i suoi vicini si configurano con pkg-config: senza
      # queste, il crate Linux non arriva nemmeno a compilare.
      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/src-tauri
            desktop-tauri/pty-bridge
          key: ${{ matrix.os }}

      # tauri-build validates that every externalBin resource EXISTS for the
      # host triple even under `cargo check` (it only reads their bytes in
      # `tauri build`). The real sidecars are produced by tauri-release.yml,
      # not here, so stub empty host-triple files to clear the build-script
      # existence gate without a slow sidecar compile.
      # `shell: bash` esplicita: su windows-latest il default e pwsh, e questo
      # script e sh.
      - name: Stub sidecar binaries (cargo check existence gate)
        working-directory: desktop-tauri/src-tauri
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/host: //p')"
          # Su Windows tauri-build cerca i sidecar con l'estensione: senza `.exe`
          # il segnaposto c'e ma il build script non lo trova lo stesso.
          ext=""
          case "$triple" in *windows*) ext=".exe" ;; esac
          mkdir -p binaries
          for s in topics-server pty-bridge webrtc-bridge; do
            touch "binaries/$s-$triple$ext"
          done

      - name: Cargo check (Tauri crate)
        run: cargo check
        working-directory: desktop-tauri/src-tauri

      # Il sidecar PTY e un crate SEPARATO: il `cargo check` qui sopra non lo
      # sfiora, e finora niente lo compilava fuori dai tag `tauri-v*` — cioe si
      # scopriva rotto alla release. `cargo test` compila e misura: tests/orphan.rs
      # verifica che un ponte abbandonato si ritiri (era il difetto del 2026-08-14:
      # 20 demoni immortali con zero client). Su Windows quei test sono
      # `#![cfg(unix)]`, quindi resta una compilazione — che e il punto.
      - name: Cargo test (PTY bridge sidecar)
        run: cargo test
        working-directory: desktop-tauri/pty-bridge
