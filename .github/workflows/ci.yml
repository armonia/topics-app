name: CI

# Quality gate on every push to main and every pull request: client typecheck,
# client lint, server parse-check, and the unit/integration suite.
#
# Why this exists: release.yml only runs on version tags, so before this nothing
# was typechecked or tested on merge — regressions (and a build-breaking tsconfig
# value) shipped silently. See AUDIT-2026-06-19.md, priority #3.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (node-pty native bridge used by server tests)
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install server deps (root)
        run: bun install --frozen-lockfile

      # node-pty ships no Linux prebuild — rebuild against the runner's Node.
      - name: Rebuild node-pty (Linux)
        run: npm rebuild node-pty

      - name: Install client deps
        run: bun install --frozen-lockfile
        working-directory: client

      # Use the LOCALLY pinned tsc (5.9.3): `bunx tsc` could fetch a newer major
      # whose deprecation handling differs and re-break the build gate.
      - name: Typecheck client (tsc -b)
        run: ./node_modules/.bin/tsc -b
        working-directory: client

      - name: Lint client (eslint)
        run: bun run lint
        working-directory: client

      # The server runs on Bun with no build-time tsc step. This ratchet
      # typechecks it (tsconfig.server.json) and fails only if the error count
      # rises above the grandfathered baseline — so new type errors are caught
      # while the known backlog is burned down over time (audit #3).
      - name: Typecheck server (ratchet)
        run: bun run typecheck:server

      - name: Unit + integration tests
        run: bun test:unit

      # Collect (don't run) every Playwright spec: catches transpile/import
      # errors across the whole E2E suite without needing the app or browsers.
      # `--list` aborts on the first bad spec, so one broken file used to mask
      # the entire suite (see the context-settings ESM/require fix).
      - name: E2E spec collection
        run: npx playwright test --list

  # The Tauri shell is the primary desktop app (Electron was archived in v2.0.0,
  # recoverable on branch `electron-archive`). Its Rust crate compiles only on a
  # native toolchain, so `cargo check` it on macOS to catch Rust regressions on
  # every push/PR — the same gate the old Electron typecheck job provided.
  tauri:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Cargo check (Tauri crate)
        run: cargo check
        working-directory: desktop-tauri/src-tauri
