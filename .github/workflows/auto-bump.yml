name: Auto-bump patch

# Increments the PATCH (the z in x.y.z) in lockstep across package.json /
# tauri.conf.json / Cargo.toml / Cargo.lock, commits it back to main, and then
# builds and publishes the Tauri installers for that version, so a merge on main
# reaches everybody's auto-updater with no manual step.
#
# THE GATE, and why this file changed on 2026-08-16. The policy "main always
# ships" (approved 2026-07-10) built installers on every merge, and the build
# itself was the gate: a merge that broke compilation published nothing.
# Measured over 60 runs, that gate let everything else through: 37 successful
# releases, 28 of them on a SHA whose CI was red or cancelled. Compiling is not
# passing the tests. Since then the gate is a GREEN CI, not a build.
#
# WHAT CHANGED ON 2026-08-27, and it is the shape of the question. Measured at
# 08:30 that day: 18 commits on origin/main in one hour, ~13 minutes for a CI
# run to judge one of them. The job used to bump THE SHA THE CI HAD APPROVED and
# then push; by the time it ran, main had moved and the push was not
# fast-forward, so it gave up. Rightly so: forcing erases somebody else's
# commit, and re-bumping on the new tip publishes code the CI never saw. But the
# consequence was that a release only happened when a run finished while its SHA
# was still the tip - a coincidence, not a mechanism. No release at all between
# 04:37 and 09:32 that day; twelve of them once the rate dropped.
#
# So the question is asked the other way round now. The candidate is THE TIP OF
# MAIN, and the condition is a green verdict on that exact SHA
# (`scripts/release-gate.ts`, one pure function with a test per branch). The
# shipped SHA is the measured SHA by construction, the push is fast-forward by
# construction, and a tick that finds no verdict yet costs nothing - which is
# what makes it safe to ask again on a schedule until the answer is yes.
# Releases come out in BATCHES, one per quiet window instead of one per merge.
# That is the trade, and it is deliberate.
#
# TWO TRIGGERS, ONE CODE PATH. `workflow_run` is the low-latency tick: when a CI
# run completes and its commit is still the tip, the release goes out within the
# minute, which is the normal case. `schedule` is the catch-up: an event that
# arrived while main was ahead, or a run evicted from the concurrency queue,
# used to park the chain until the next merge. Now the next tick picks it up.
# Neither trigger has a gate of its own: both run the same script.
#
# NO LOOP, for two independent reasons. The bump commit is pushed with the
# default GITHUB_TOKEN, which by design triggers no workflow: the CI does not
# run on the bump, so the tip of a bump has no run at all and the gate refuses
# it. The `chore(release):` prefix check is the second net, because one net on a
# cycle that publishes to users is not enough.
#
# Why the release runs HERE and not off a `tauri-v*` tag: the GITHUB_TOKEN
# cannot start a tag- or dispatch-driven workflow, and we use no PAT. The
# `release` job is not a fan-out but a direct call (`workflow_call`) inside this
# same run. `scripts/ship.sh` remains for one-off manual releases.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Every 10 minutes. Cron on GitHub is best-effort and can drift by several
  # minutes under load, which is fine: this tick is the catch-up, not the
  # deadline. A tick with nothing to do is two API calls and exits.
  schedule:
    - cron: "*/10 * * * *"
  # For asking the question by hand after an incident.
  workflow_dispatch:

concurrency:
  group: auto-bump-main
  # Never two releases in flight. A tick that gets evicted from this queue while
  # a release builds is harmless: the next one asks the same question.
  cancel-in-progress: false

jobs:
  bump:
    # NO JOB-LEVEL `if`. It used to read the `workflow_run` payload, which is
    # empty on a scheduled tick, and a condition that silently evaluates to
    # false is exactly how this chain would stop publishing without a single
    # red run to show for it. The gate lives in one place now, and that place
    # has tests.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The tip of main, explicitly: on a scheduled run there is no event
          # SHA to inherit, and on a `workflow_run` the default would be the
          # commit that triggered the CI, which is precisely the SHA this
          # redesign stopped trusting to still be the tip.
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Is the tip of main green?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TIP="$(git rev-parse HEAD)"
          MSG="$(git log -1 --format=%s "$TIP")"
          # The CI run for THAT sha on main, or `null` when the CI has not been
          # asked yet (or its run was evicted from the concurrency queue). The
          # API answers newest first; a COMPLETED one wins over a fresher re-run
          # still in flight, because a verdict beats a maybe.
          RUN="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TIP}&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")
                   | {status, conclusion, head_sha, head_branch}] as $runs
                  | (($runs | map(select(.status == "completed")) | first)
                     // ($runs | first) // null)')"
          jq -n --arg sha "$TIP" --arg msg "$MSG" --argjson run "${RUN:-null}" \
            '{tipSha: $sha, tipMessage: $msg, branch: "main", run: $run}' \
            | bun run scripts/release-gate.ts

      - name: Bump patch across lockstep files
        id: bump
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: echo "version=$(bash scripts/bump-version.sh patch)" >> "$GITHUB_OUTPUT"

      # The changelog is GENERATED from git history (scripts/gen-changelog.mjs),
      # so the version just bumped can only get one AFTER the bump and before
      # the commit. It used to be run by hand: the commit of 12/08 promised "no
      # longer a step somebody has to remember" and wired it to nothing, and
      # three days later it was 37 versions behind - and this is the changelog
      # the user reads inside the app and on the landing page.
      #
      # It does not block the release: a changelog that fails to regenerate is a
      # defect, and stopping the shipment over it would be worse than the defect.
      - name: Regenerate the changelog for this version
        if: ${{ steps.gate.outputs.publish == 'true' }}
        continue-on-error: true
        run: node scripts/gen-changelog.mjs

      - name: Commit the bump back to main
        id: push
        if: ${{ steps.gate.outputs.publish == 'true' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          APPROVED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump v${VERSION}"
          # NOT `--force-with-lease`, and not a blind push either. The gate above
          # checked that the parent of this commit IS the tip of main, so the
          # push is fast-forward unless somebody landed in the seconds since. If
          # that happens the push must FAIL: forcing would erase their commit,
          # and re-bumping on the new tip would publish code the CI has not
          # judged. Both are refusals this file exists to make.
          #
          # GIVING UP IS NOT FAILING, and the difference has to be visible from
          # outside. This `exit` was 1 once, and painted the run red on a race
          # where nothing had broken; a red that is not a fault teaches people
          # not to look at reds. It exits ZERO without writing `sha`, and the
          # `release` job is guarded on that output: the brake stays, the colour
          # tells the truth. The next tick (10 minutes at most) tries again.
          if ! git push origin "HEAD:main"; then
            echo "::warning::main moved past ${APPROVED_SHA} during the bump: nothing shipped, the next tick will pick up the new tip once the CI has judged it."
            exit 0
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Build and publish the installers for the version just bumped, live to
  # everybody. Skips itself when `bump` did not ship.
  release:
    needs: bump
    # Does not start when the gate said no or the push lost the race: with no
    # `sha` there is nothing to build. This condition used to be an `exit 1`,
    # which is a red run used as a switch.
    if: ${{ needs.bump.outputs.sha != '' }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/tauri-release.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
      tag: tauri-v${{ needs.bump.outputs.version }}
