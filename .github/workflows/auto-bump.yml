name: Auto-bump patch

# Every push to main auto-increments the PATCH (the z in x.y.z) in lockstep
# across package.json / tauri.conf.json / Cargo.toml and commits it back, so the
# repo version is always ahead of the last shipped one without a manual
# chore(release) step.
#
# Loop safety: the bump commit itself starts with "chore(release):", so the `if`
# below skips it — the workflow never bumps its own bump. (The default
# GITHUB_TOKEN also cannot trigger another workflow run, a second layer of
# protection.) We deliberately do NOT also match "[skip-bump]" anywhere in the
# message: a squash-merge concatenates the branch's commit messages into the
# body, so a PR that merely mentions the loop guard would be skipped by accident.
#
# This workflow only bumps — it never builds or ships. Shipping installers is a
# deliberate act: run `scripts/ship.sh`, which tags `tauri-v<version>` from your
# own git credential and so fires tauri-release.yml (CI's GITHUB_TOKEN can't
# trigger a tag workflow, which is why the release step lives locally, not here —
# and needs no repo PAT). Rationale: a full 3-OS installer build on every merge
# would burn the macOS runner budget; ship when a version is actually worth
# pushing to users.
on:
  push:
    branches: [main]

concurrency:
  group: auto-bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump patch across lockstep files
        id: bump
        run: echo "version=$(bash scripts/bump-version.sh patch)" >> "$GITHUB_OUTPUT"

      - name: Commit the bump back to main
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump v${VERSION}"
          git push origin "HEAD:${BRANCH}"
