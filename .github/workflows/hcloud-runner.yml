name: Server Hetzner per i job pesanti

# Workflow riusabile: crea (mode: create) o cancella (mode: delete) un server Hetzner Cloud
# che esiste solo per la durata di una run. Sopra ci girano N runner GitHub effimeri, tutti con
# la stessa etichetta (`label`), e il job di create fa la mappa `placement` di quale job della
# matrice va dove: PC di Attilio (runner del broker sul Mac), questo server, o ubuntu-latest.
#
# Perché più runner su un server solo: Hetzner fattura l'ora intera anche per 5 minuti,
# quindi un server per job costerebbe N ore per run. Un cx53 (16 core, 32 GB) con 4 runner
# vale 4 runner GitHub da 4 core / 8 GB, per 0,047 €/h.
#
# Copia di armonia/quadra (.github/workflows/hcloud-runner.yml), adattata a un repo PUBBLICO:
# - create e delete girano su ubuntu-latest (gratis qui), mai su macchine nostre: sono gli
#   unici job che vedono HCLOUD_TOKEN e RUNNER_ADMIN_TOKEN, e non eseguono codice della PR;
# - se nessun taglio nasce (esauriti, limite di core) `runners` è 0 e i job vanno su GitHub;
# - i runner sono --ephemeral (un job e via) e l'etichetta è unica per run, quindi la mappa
#   non dà mai a un'etichetta più job che runner online.
# Ripiego dei job pesanti quando il server non c'è: ubuntu-latest, come prima.
# Rete: hcloud-sweeper.yml cancella ogni ora i server gh-runner-* più vecchi di 3 ore.

on:
  workflow_call:
    inputs:
      mode:
        description: create | delete
        type: string
        required: true
      label:
        description: (delete) etichetta restituita da create
        type: string
        default: ""
      server_id:
        description: (delete) id del server restituito da create
        type: string
        default: ""
      types:
        description: 'tagli da provare in ordine, ciascuno coi suoi runner: "cx53:4 cx43:2"'
        type: string
        default: "cx53:4"
      playwright:
        description: installa all'avvio le librerie di sistema di Chromium per Playwright
        type: boolean
        default: false
      apt_packages:
        description: pacchetti apt in più che l'immagine GitHub ha e Ubuntu no (es. postgresql-client)
        type: string
        default: ""
      playwright_version:
        description: versione di Playwright di cui installare le librerie di sistema
        type: string
        default: "1.59.1"
      controller:
        description: runs-on (JSON) dei job di create/delete
        type: string
        default: '"ubuntu-latest"'
      shards:
        description: (create) i job della matrice da piazzare, JSON (es. [0,1,2]); vuoto = nessuna mappa
        type: string
        default: ""
      pc_slots:
        description: (create) quanti runner del PC aspettare al massimo (0 = il PC non si chiede)
        type: number
        default: 0
    outputs:
      label:
        value: ${{ jobs.create.outputs.label }}
      server_id:
        value: ${{ jobs.create.outputs.server_id }}
      runners:
        description: quanti runner sono nati sul server (0 senza server)
        value: ${{ jobs.create.outputs.runners }}
      placement:
        description: 'mappa {"s<N>": etichetta} di dove va ogni job; chi manca va su ubuntu-latest'
        value: ${{ jobs.create.outputs.placement }}
      attempt:
        description: il tentativo della run per cui vale la mappa
        value: ${{ jobs.create.outputs.attempt }}
    secrets:
      HCLOUD_TOKEN:
        required: true
      RUNNER_ADMIN_TOKEN:
        required: true

jobs:
  create:
    if: ${{ inputs.mode == 'create' }}
    runs-on: ${{ fromJSON(inputs.controller) }}
    timeout-minutes: 25
    # A red here would make the whole run red, and auto-bump ships only green runs of main:
    # the machines can make the run faster, never red. Without outputs every job goes to GitHub.
    continue-on-error: true
    outputs:
      label: ${{ steps.win.outputs.label }}
      server_id: ${{ steps.win.outputs.server_id }}
      runners: ${{ steps.online.outputs.hz_n }}
      placement: ${{ steps.online.outputs.placement }}
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Ora di inizio
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      # Solo lo script della mappa: questo job vede i token e non esegue altro codice del ramo.
      - uses: actions/checkout@v5
        if: ${{ inputs.shards != '' }}
        with:
          sparse-checkout: scripts/e2e-placement.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Guardia di spesa (vincolo di Attilio: mai danni economici). Il tetto mensile lo
      # tiene `hetzner-tetto` sul Mac, che oltre i 30 €/mese della voce ci mette HETZNER_STOP=1 su questo
      # repo; qui si rifanno i due controlli che non dipendono dal registro: taglio ammesso e
      # al massimo 2 server effimeri accesi (CI e offload di Topics insieme).
      - name: Guardia di spesa
        id: gate
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          STOP: ${{ vars.HETZNER_STOP }}
          TYPES: ${{ inputs.types }}
        run: |
          set -euo pipefail
          no() { echo "::warning::Niente server Hetzner: $1. I job pesanti vanno sul runner di ripiego."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "${STOP:-0}" = "1" ] && no "HETZNER_STOP=1 (tetto del mese)"
          for spec in $TYPES; do
            case " ccx13 ccx23 cx23 cx33 cx43 cx53 cpx22 cpx32 " in
              *" ${spec%%:*} "*) ;; *) no "taglio ${spec%%:*} non ammesso" ;;
            esac
          done
          ids=""
          for sel in gh-runner offload type%3Dgithub-runner; do
            # API muta = niente server: nel dubbio non si spende.
            out=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" \
              "https://api.hetzner.cloud/v1/servers?per_page=50&label_selector=$sel") || no "API Hetzner non risponde"
            ids="$ids $(jq -r '.servers[].id' <<<"$out")"
          done
          n=$(printf '%s\n' $ids | sort -u | grep -c . || true)
          [ "$n" -ge 2 ] && no "già $n server effimeri accesi (max 2)"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # UNA CHIAMATA ALL'API PER TAGLIO E ZONA, IL PRIMO CHE NASCE VINCE.
      #
      # Niente Cyclenerd/hcloud-github-runner: provava un taglio solo, due zone, con 10 s di
      # attesa fra i tentativi, e il 10/11 sera cx53 e cx43 erano esauriti in fsn1, nbg1 e hel1
      # (`resource_unavailable`, run 42876278262). Qui ogni tentativo è una POST che fallisce
      # subito, e i runner li installa cloud-init (user_data): prima le librerie, poi i runner,
      # così nessun job parte su una macchina a metà. Quanti runner per taglio lo dice `types`
      # ("cx53:4 cx43:2": 4 vCPU per runner, come un runner GitHub). Che siano davvero online
      # lo conta il passo dopo.
      - name: Crea il server
        id: win
        if: ${{ steps.gate.outputs.ok == 'true' }}
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          TYPES: ${{ inputs.types }}
          PLAYWRIGHT: ${{ inputs.playwright }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          PW_VERSION: ${{ inputs.playwright_version }}
        run: |
          set -uo pipefail
          name="gh-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "runners=0" >> "$GITHUB_OUTPUT"
          # Token di registrazione: vale 1 ora, riusabile per tutti i runner del server.
          token=$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" | jq -er .token) \
            || { echo "::warning::Niente token di registrazione dei runner: i job vanno sul ripiego."; exit 0; }
          echo "::add-mask::$token"
          user_data() {  # $1 = runner sul server
            echo '#!/bin/bash'
            echo 'export DEBIAN_FRONTEND=noninteractive'
            echo "apt-get update -qq >/var/log/apt-extra.log 2>&1; apt-get install -y -qq jq curl $APT_PACKAGES >>/var/log/apt-extra.log 2>&1"
            if [ "$PLAYWRIGHT" = "true" ]; then
              # Una volta sola qui, prima dei runner: più `--with-deps` insieme si contendono il lock di apt.
              echo "curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz | tar xJ -C /opt"
              echo "PATH=/opt/node-v20.18.1-linux-x64/bin:\$PATH npx -y playwright@$PW_VERSION install-deps chromium webkit >/var/log/pw-deps.log 2>&1"
            fi
            echo "N=$1 NAME=$name URL=https://github.com/${GITHUB_REPOSITORY} TOKEN=$token"
            cat <<'EOS'
          V=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r .tag_name | sed 's/^v//')
          # Runner 0 = `prepare-e2e` (etichetta <nome>-prep, un job leggero), poi uno per shard.
          for i in 0 $(seq 1 "$N"); do
            d=/actions-runner-$i; mkdir -p "$d"; cd "$d"
            curl -fsSL "https://github.com/actions/runner/releases/download/v$V/actions-runner-linux-x64-$V.tar.gz" | tar xz
            [ "$i" = 0 ] && ./bin/installdependencies.sh >/var/log/runner-deps.log 2>&1
            l=$NAME; [ "$i" = 0 ] && l=$NAME-prep
            RUNNER_ALLOW_RUNASROOT=1 ./config.sh --unattended --url "$URL" --token "$TOKEN" \
              --name "$NAME-$i" --labels "$l" --no-default-labels --disableupdate --ephemeral >"/var/log/runner-$i.log" 2>&1
            # HOME sua: la CI ne ricava la fascia di porte (ci.yml) e due job non si pestano ~/.cache.
            mkdir -p "/srv/rh-$i"
            HOME="/srv/rh-$i" SHELL=/bin/bash RUNNER_ALLOW_RUNASROOT=1 setsid nohup ./run.sh >>"/var/log/runner-$i.log" 2>&1 < /dev/null &
          done
          EOS
          }
          for spec in $TYPES; do
            ty=${spec%%:*}; n=${spec##*:}
            for loc in fsn1 nbg1 hel1; do
              body=$(jq -n --arg name "$name" --arg ty "$ty" --arg loc "$loc" --arg ud "$(user_data "$n")" \
                '{name: $name, server_type: $ty, image: "ubuntu-24.04", location: $loc, ssh_keys: [112097822],
                  labels: {type: "github-runner", "gh-runner": "ci"}, user_data: $ud}')
              r=$(curl -sS -X POST -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
                https://api.hetzner.cloud/v1/servers -d "$body")
              id=$(jq -r '.server.id // empty' <<<"$r" 2>/dev/null)
              if [ -n "$id" ]; then
                echo "server $name: $ty in $loc ($id), $n runner"
                { echo "label=$name"; echo "server_id=$id"; echo "runners=$n"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$ty $loc: $(jq -r '.error.code // "?"' <<<"$r" 2>/dev/null)"
            done
          done
          echo "::warning::Nessun server Hetzner disponibile ($TYPES): i job vanno sul ripiego."

      # QUANTI RUNNER CI SONO DAVVERO, E DOVE VA OGNI JOB.
      #
      # I runner del server li registra cloud-init in background, e uno può mancare
      # (download del runner in 504 il 09/11). Il PC li accende il broker sul
      # Mac (`ci-pc-broker`, in jarvis) quando vede questo job in corso e il PC è libero:
      # etichetta pc-<run>-<tentativo>, runner effimeri JIT. Qui si contano quelli ONLINE
      # con l'etichetta, e la mappa non dà mai a un'etichetta più job che runner: un job in
      # più resterebbe in coda per sempre (runner effimeri, server cancellato dopo gli shard).
      - name: Runner online e posto di ogni job
        id: online
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          HZ_LABEL: ${{ steps.win.outputs.label }}
          HZ_WANT: ${{ steps.win.outputs.runners }}
          PC_WANT: ${{ (vars.PC_CI == '1' && inputs.shards != '') && inputs.pc_slots || 0 }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100"
          pc_label="pc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          count() {  # runner online con l'etichetta $1 e ancora liberi
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api" 2>/dev/null \
              | jq --arg l "$1" '[.runners[] | select(.status == "online" and (.busy | not) and any(.labels[]; .name == $l))] | length' 2>/dev/null \
              || echo 0
          }
          hz_n=0; pc_n=0; prep=""
          # Il PC ha avuto tutto il tempo della creazione del server; senza server, 2 minuti
          # dall'inizio del job. Il server: fino a 4 minuti per gli altri runner di cloud-init.
          end=$(( $(date +%s) + 240 ))
          pc_end=$(( ${JOB_T0:-$(date +%s)} + 120 ))
          while :; do
            [ -n "$HZ_LABEL" ] && hz_n=$(count "$HZ_LABEL")
            [ "${PC_WANT:-0}" -gt 0 ] && pc_n=$(count "$pc_label")
            now=$(date +%s)
            hz_done=1; [ -n "$HZ_LABEL" ] && [ "$hz_n" -lt "${HZ_WANT:-0}" ] && [ "$now" -lt "$end" ] && hz_done=0
            pc_done=1; [ "${PC_WANT:-0}" -gt 0 ] && [ "$pc_n" -lt "$PC_WANT" ] && [ "$now" -lt "$pc_end" ] && pc_done=0
            [ "$hz_done" = 1 ] && [ "$pc_done" = 1 ] && break
            sleep 10
          done
          # prepare-e2e: il runner -prep del PC o del server, se online; sennò ubuntu-latest.
          if [ "${PC_WANT:-0}" -gt 0 ] && [ "$(count "$pc_label-prep")" -gt 0 ]; then prep="$pc_label-prep"
          elif [ -n "$HZ_LABEL" ] && [ "$(count "$HZ_LABEL-prep")" -gt 0 ]; then prep="$HZ_LABEL-prep"; fi
          [ "$pc_n" -gt "${PC_WANT:-0}" ] && pc_n=$PC_WANT
          [ "$hz_n" -gt "${HZ_WANT:-0}" ] && hz_n=${HZ_WANT:-0}
          echo "hz_n=$hz_n" >> "$GITHUB_OUTPUT"
          echo "pc_n=$pc_n" >> "$GITHUB_OUTPUT"
          placement='{}'
          if [ -n "$SHARDS" ]; then
            placement=$(bash scripts/e2e-placement.sh "$SHARDS" "$pc_label" "$pc_n" "$HZ_LABEL" "$hz_n" "$prep") || placement='{}'
          fi
          echo "placement=$placement" >> "$GITHUB_OUTPUT"
          echo "PC: $pc_n runner ($pc_label) · Hetzner: $hz_n runner (${HZ_LABEL:-nessun server}) · mappa: $placement"
          echo "::notice title=Posto degli shard e2e::PC $pc_n, Hetzner $hz_n, il resto su GitHub; prepare-e2e su ${prep:-GitHub}"

  delete:
    if: ${{ inputs.mode == 'delete' }}
    runs-on: ${{ fromJSON(inputs.controller) }}
    timeout-minutes: 15
    steps:
      # Per prefisso del nome, non per id: se il job di create è morto dopo aver creato il
      # server, il server esiste ma l'output no. Il nome è gh-runner-<run>-<tentativo>.
      - name: Cancella i server e i runner di questa run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          p="gh-runner-${GITHUB_RUN_ID}-"
          h=https://api.hetzner.cloud/v1
          curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "$h/servers?label_selector=type%3Dgithub-runner&per_page=50" \
            | jq -r --arg p "$p" '.servers[] | select(.name | startswith($p)) | "\(.id) \(.name)"' \
            | while read -r id name; do
                curl -fsS -X DELETE -H "Authorization: Bearer $HCLOUD_TOKEN" "$h/servers/$id" >/dev/null && echo "cancellato $name"
              done
          sleep 5
          resto=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "$h/servers?label_selector=type%3Dgithub-runner&per_page=50" \
            | jq -r --arg p "$p" '[.servers[] | select(.name | startswith($p)) | .name] | join(" ")')
          if [ -n "$resto" ]; then echo "::error::Server ancora accesi: $resto"; exit 1; fi
          echo "nessun server di questa run acceso"
          # The PC's runners of this run that took no shard go too: once removed from
          # GitHub their process on the PC exits (the broker on the Mac also sweeps them).
          # The server is gone, which is what costs money. A runner left registered is
          # offline and harmless, and the hourly sweeper removes it: a GitHub API hiccup
          # here (502 in run 42839400563) is a warning, not a red delete job.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners"
          { curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api?per_page=100" \
            | jq -r --arg p "$p" --arg q "pc-${GITHUB_RUN_ID}-" '.runners[] | select((.name | startswith($p)) or ((.name | startswith($q)) and (.busy | not))) | .id' \
            | while read -r id; do
                curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/$id" && echo "tolto runner $id"
              done; } || echo "::warning::runner di questa run non tolti da GitHub: li toglie lo sweeper"
