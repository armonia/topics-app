name: Purga artifact (igiene del repo)

# La quota artifact di Actions e' dell'ORGANIZZAZIONE — 500 MB sul piano free —
# non del repo, e l'API per cancellarli e' invece per-repo: il purge va messo dove
# gli artifact si accumulano, non dove danno fastidio. Il 16/08 il purge viveva in
# quadra, che di artifact ne produce zero, mentre a riempire la quota erano altri.
#
# ATTENZIONE a una cosa che non e' scritta da nessuna parte nella UI: solo i repo
# PRIVATI consumano quota. topics-app e' pubblico, quindi i suoi report — per
# quanto grossi — sono gratis, e questa purga qui e' IGIENE (meno rumore, meno
# storico inutile), NON il rimedio alla quota.
#
# Se gli upload tornano a fallire con "Artifact storage quota has been hit", qui
# non c'e' niente da guardare: il colpevole e' un repo PRIVATO. Il rimedio sta in
# quadra, `scripts/purge-org-artifacts.sh`, che li copre tutti in un colpo (un
# workflow non potrebbe: il suo GITHUB_TOKEN vede solo il proprio repo).
#
# Due cose diverse, entrambe necessarie:
#  - gli SCADUTI: GitHub marca `expired` (il contenuto non si scarica piu') ma non
#    li cancella, e finche' esistono occupano quota. Erano 263, 4,6 GB di spazio
#    senza contenuto. Cancellarli non perde nulla.
#  - i VIVI oltre il tetto: si buttano dal piu' vecchio. Il report che serve e'
#    sempre quello dell'ultimo rosso.

on:
  schedule:
    - cron: "43 2 * * *" # ogni notte, prima della nightly delle 03:17
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: artifact-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Rimuovi gli scaduti e rientra sotto il tetto
        uses: actions/github-script@v7
        with:
          script: |
            // 250 MB: meta' della quota dell'org, cosi' resta spazio per gli
            // altri repo, che insieme stanno sotto la decina di MB per run.
            const CAP_BYTES = 250 * 1024 * 1024;
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100,
            });
            // Un 500 di GitHub su UNA cancellazione faceva cadere tutta la purga
            // (3 notti rosse su 6, 11-14/11). Si riprova tre volte con attesa
            // crescente; un 404 vuol dire gia' sparito; se resta un errore la
            // purga va avanti con gli altri e quello si ritenta la notte dopo.
            // Rosso solo se non ne e' andata a buon fine nessuna: li' il guasto
            // e' del token o dei permessi, non di un artifact.
            let ok = 0, failed = 0;
            const del = async (a, why) => {
              for (let attempt = 1; ; attempt++) {
                try {
                  await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
                  break;
                } catch (e) {
                  if (e.status === 404) break;
                  if (e.status >= 500 && attempt < 3) {
                    await new Promise((r) => setTimeout(r, 2000 * attempt));
                    continue;
                  }
                  failed++;
                  core.warning(`non rimosso ${a.name} (${a.id}): HTTP ${e.status ?? "?"} ${e.message}`);
                  return false;
                }
              }
              ok++;
              core.info(`rimosso ${a.name} (${(a.size_in_bytes / 1048576).toFixed(1)} MB) — ${why}`);
              return true;
            };
            const live = [];
            let freed = 0;
            for (const a of all) {
              if (a.expired) { if (await del(a, "scaduto")) freed += a.size_in_bytes; }
              else live.push(a);
            }
            live.sort((x, y) => new Date(x.created_at) - new Date(y.created_at));
            let used = live.reduce((n, a) => n + a.size_in_bytes, 0);
            while (used > CAP_BYTES && live.length > 1) {
              const a = live.shift();
              if (!(await del(a, "sopra il tetto"))) continue;
              used -= a.size_in_bytes;
              freed += a.size_in_bytes;
            }
            core.info(`liberati ${(freed / 1048576).toFixed(1)} MB — in uso ora: ${(used / 1048576).toFixed(1)} MB in ${live.length} artifact`);
            await core.summary
              .addHeading("Purga artifact")
              .addRaw(`Liberati **${(freed / 1048576).toFixed(1)} MB**. In uso: **${(used / 1048576).toFixed(1)} MB** in ${live.length} artifact (tetto ${CAP_BYTES / 1048576} MB).`)
              .write();
            if (failed > 0 && ok === 0) core.setFailed(`nessuna cancellazione riuscita (${failed} errori)`);
