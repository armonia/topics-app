name: Auto Tag

# Push a version bump to main and the release cuts itself: when
# electron-app/package.json "version" has no matching v<version> tag yet,
# this creates the tag at the pushed commit and dispatches the Release
# workflow on it. Tags created with GITHUB_TOKEN don't trigger
# on:push:tags workflows (docs: only workflow_dispatch/repository_dispatch
# are exempt), hence the explicit `gh workflow run`.
#
# Manual tagging (CONTRIBUTING.md) keeps working unchanged — if the tag
# already exists this is a no-op.

on:
  push:
    branches: [main]
    paths: ['electron-app/package.json']

permissions:
  contents: write   # create + push the tag
  actions: write    # dispatch the Release workflow

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./electron-app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag & dispatch release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # Tag exists. If a release for it is ALSO published, there's nothing
            # to do. But if the tag was pushed yet the release is missing (a
            # transient `gh workflow run` failure last time), re-dispatch — the
            # old code exited 0 here, so a failed dispatch permanently skipped
            # the release with no recovery short of deleting the tag.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already released — nothing to do."
              exit 0
            fi
            echo "$TAG tag exists but no release found — re-dispatching."
            gh workflow run release.yml --ref "$TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"
          echo "Created $TAG and dispatched the Release workflow."
