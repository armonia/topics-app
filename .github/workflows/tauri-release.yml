name: Release (Tauri)

# Opt-in Tauri desktop release. Tag `tauri-vX.Y.Z` (matching the "version" in
# desktop-tauri/src-tauri/tauri.conf.json) to build + publish the Tauri installers
# and the auto-update manifest:
#   git tag tauri-v0.1.0 && git push origin tauri-v0.1.0
#
# Kept on a SEPARATE tag namespace from the Electron release (`v*`) during the
# migration, so shipping Tauri is deliberate while it's not yet the production
# shell. Once Tauri takes over, switch the trigger to `v*` so both shells (or just
# Tauri) release in lockstep on one tag.
on:
  push:
    tags: ['tauri-v*']
  workflow_dispatch:

permissions:
  contents: write # GITHUB_TOKEN creates the GitHub Release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE Universal macOS build (arm64 + x86_64) on Apple Silicon, mirroring
          # the Electron job — a single universal .app/.dmg → one correct
          # latest.json updater manifest (two arch jobs would race to clobber it).
          - { os: macos-14, args: '--target universal-apple-darwin' }
          - { os: windows-latest, args: '' }
          # deb + rpm only: AppImage bundling runs linuxdeploy, which fails
          # opaquely on the ~100MB bun server sidecar even with NO_STRIP
          # (takes 2 and 3 of tauri-v2.1.0). deb+rpm don't use linuxdeploy.
          - { os: ubuntu-latest, args: '--bundles deb,rpm' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS needs both arch std libs; empty elsewhere.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/src-tauri
            desktop-tauri/pty-bridge

      - name: Linux WebKitGTK + tray build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install server deps (for the sidecar compile)
        run: bun install --frozen-lockfile

      # Compile the Bun server into a self-contained sidecar binary named with the
      # Rust target triple Tauri's externalBin expects. WITHOUT this the installed
      # app serves the UI but has no data server on a virgin machine (blank
      # "connecting"). macOS builds a UNIVERSAL sidecar (arm64+x86_64 via lipo) to
      # match the universal .app. See scripts/build-server-sidecar.sh + PORTING-PLAN
      # W-A. The script also regenerates the embedded-migrations manifest first.
      - name: Build server sidecar (macOS universal)
        if: runner.os == 'macOS'
        run: ./scripts/build-server-sidecar.sh macos
      - name: Build server sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build-server-sidecar.sh windows
      - name: Build server sidecar (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-server-sidecar.sh linux

      # Build the standalone Rust PTY-bridge sidecar (binaries/pty-bridge-<triple>).
      # WITHOUT this the standalone sidecar on a virgin machine can't spawn a PTY
      # bridge (the compiled Bun server can't run node-pty) and shell/claude-code tabs
      # never open. A ~0.5 MB wire-compatible port of pty-bridge.mjs. See
      # scripts/build-pty-bridge.sh + desktop-tauri lib.rs bundled_pty_bridge_bin().
      # Must run BEFORE tauri build so the externalBin (tauri.conf.json) resolves.
      # Windows compiles a no-op stub (bridge is Unix-socket only) just to satisfy the
      # per-target externalBin bundle; lib.rs never spawns it there.
      - name: Build PTY bridge sidecar (macOS universal)
        if: runner.os == 'macOS'
        run: ./scripts/build-pty-bridge.sh macos
      - name: Build PTY bridge sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build-pty-bridge.sh windows
      - name: Build PTY bridge sidecar (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-pty-bridge.sh linux

      - name: Build client (Vite → public/, the Tauri frontendDist)
        working-directory: client
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build & publish Tauri (signed + notarized when secrets present)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign) — REQUIRED for auto-update to verify the
          # downloaded bundle before self-replacing. Generate once with
          # `cargo tauri signer generate` and add these secrets. Absent → an
          # unsigned, non-auto-updating (but runnable) build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy strips every binary in the AppDir by default and chokes on
          # the bun-compiled server sidecar ("failed to run linuxdeploy", tauri-v2.1.0
          # take-2). Bun single-file executables embed their JS payload past the ELF
          # sections and don't survive strip anyway. Linux-only effect.
          NO_STRIP: true
          # macOS code signing + notarization: DISABLED for now. The tauri-v2.1.0
          # run proved the inherited MAC_CSC_LINK org secret is NOT an importable
          # .p12 for tauri-action (`security import: failed to import keychain
          # certificate` — it was electron-builder's CSC_LINK format), and passing
          # a broken value fails the whole macOS job instead of skipping signing.
          # Ship unsigned (Gatekeeper: right-click → Open on first launch; the
          # Tauri updater still verifies bundles via TAURI_SIGNING_* above, which
          # is independent of Apple signing). To re-enable: export a Developer ID
          # Application cert as base64 .p12 into APPLE_CERTIFICATE(+_PASSWORD),
          # set APPLE_SIGNING_IDENTITY/APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID, and
          # restore the env lines here.
        with:
          projectPath: desktop-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Topics (Tauri) ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
