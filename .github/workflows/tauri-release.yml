name: Release (Tauri)

# Builds the Tauri desktop installers (macOS Universal + Windows + Linux) and the
# `latest.json` auto-update manifest, and PUBLISHES them to a GitHub Release so
# the signed auto-updater picks them up immediately.
#
# Three-stage on purpose (create-release → build matrix → publish):
#   • create-release makes ONE draft release up front and hands its id to the
#     builders. The old single-stage matrix had all three OS jobs call
#     tauri-action's own createRelease for the same tag concurrently — a race that
#     started returning 403 "Resource not accessible by integration" (the token
#     has contents:write and `gh api` create works fine; the concurrent
#     create-a-release calls do not). Creating once, then uploading by releaseId,
#     removes the race.
#   • publish flips the draft to published only AFTER every OS built, so a
#     half-built version never goes live.
#
# Fired three ways:
#   • After every merge to main: auto-bump.yml calls this as a reusable workflow
#     (workflow_call) with the freshly-bumped commit + tag → every version ships
#     to everyone automatically. The build runs INSIDE the human-merge run on
#     purpose: CI's built-in GITHUB_TOKEN can't trigger a tag- or dispatch-driven
#     workflow, and we deliberately use no repo PAT.
#   • `scripts/ship.sh` (or a hand-pushed `tauri-vX.Y.Z` tag) — one-off release.
#   • workflow_dispatch — manual (re-)run from the Actions tab.
on:
  push:
    tags: ['tauri-v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit/branch to build (blank = this ref)'
        required: false
        default: ''
      tag:
        description: 'Release tag, e.g. tauri-v2.1.9 (blank = this ref name)'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA to build (the bumped commit)'
        required: true
        type: string
      tag:
        description: 'Release tag to publish, e.g. tauri-v2.1.9'
        required: true
        type: string

permissions:
  contents: write # GITHUB_TOKEN creates + publishes the GitHub Release

jobs:
  # Create (or reuse) the single draft release for this version and export its id.
  # Uses `gh api` — proven to work with the run's contents:write token — instead of
  # tauri-action's own createRelease, and does it once to avoid the matrix race.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.mk.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release
        id: mk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # tag: explicit on workflow_call (github.ref_name is "main" there); the
          # ref name on a tag push / dispatch. commitish: the exact commit to tag
          # (the bumped commit on workflow_call; the tag's own commit otherwise).
          TAG: ${{ inputs.tag || github.ref_name }}
          COMMITISH: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$REPO/releases" \
                 --jq "map(select(.tag_name==\"$TAG\")) | .[0].id // empty")"
          if [ -z "$id" ]; then
            id="$(gh api -X POST "repos/$REPO/releases" \
                    -f tag_name="$TAG" \
                    -f target_commitish="$COMMITISH" \
                    -f name="Topics (Tauri) $TAG" \
                    -F draft=true -F prerelease=false --jq .id)"
            echo "Created draft release $id for $TAG @ $COMMITISH"
          else
            echo "Reusing existing draft release $id for $TAG"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE Universal macOS build (arm64 + x86_64) on Apple Silicon, mirroring
          # the Electron job — a single universal .app/.dmg → one correct
          # latest.json updater manifest (two arch jobs would race to clobber it).
          - { os: macos-14, args: '--target universal-apple-darwin' }
          - { os: windows-latest, args: '' }
          # deb + rpm only: AppImage bundling runs linuxdeploy, which fails
          # opaquely on the ~100MB bun server sidecar even with NO_STRIP
          # (takes 2 and 3 of tauri-v2.1.0). deb+rpm don't use linuxdeploy.
          - { os: ubuntu-latest, args: '--bundles deb,rpm' }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      # workflow_call passes the bumped commit SHA; a tag push resolves the tag;
      # dispatch uses its (optional) input or the selected ref. inputs.* is the
      # trusted output of auto-bump (git rev-parse) or a manual dispatch — never
      # external/untrusted content, so it's safe in ref:.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS needs both arch std libs; empty elsewhere.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/src-tauri
            desktop-tauri/pty-bridge

      - name: Linux WebKitGTK + tray build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install server deps (for the sidecar compile)
        run: bun install --frozen-lockfile

      # Compile the Bun server into a self-contained sidecar binary named with the
      # Rust target triple Tauri's externalBin expects. WITHOUT this the installed
      # app serves the UI but has no data server on a virgin machine (blank
      # "connecting"). macOS builds a UNIVERSAL sidecar (arm64+x86_64 via lipo) to
      # match the universal .app. See scripts/build-server-sidecar.sh + PORTING-PLAN
      # W-A. The script also regenerates the embedded-migrations manifest first.
      - name: Build server sidecar (macOS universal)
        if: runner.os == 'macOS'
        run: ./scripts/build-server-sidecar.sh macos
      - name: Build server sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build-server-sidecar.sh windows
      - name: Build server sidecar (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-server-sidecar.sh linux

      # Build the standalone Rust PTY-bridge sidecar (binaries/pty-bridge-<triple>).
      # WITHOUT this the standalone sidecar on a virgin machine can't spawn a PTY
      # bridge (the compiled Bun server can't run node-pty) and shell/claude-code tabs
      # never open. A ~0.5 MB wire-compatible port of pty-bridge.mjs. See
      # scripts/build-pty-bridge.sh + desktop-tauri lib.rs bundled_pty_bridge_bin().
      # Must run BEFORE tauri build so the externalBin (tauri.conf.json) resolves.
      # Windows compiles a no-op stub (bridge is Unix-socket only) just to satisfy the
      # per-target externalBin bundle; lib.rs never spawns it there.
      - name: Build PTY bridge sidecar (macOS universal)
        if: runner.os == 'macOS'
        run: ./scripts/build-pty-bridge.sh macos
      - name: Build PTY bridge sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build-pty-bridge.sh windows
      - name: Build PTY bridge sidecar (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-pty-bridge.sh linux

      - name: Build client (Vite → public/, the Tauri frontendDist)
        working-directory: client
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Tauri + upload to the draft release (signed when secrets present)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign) — REQUIRED for auto-update to verify the
          # downloaded bundle before self-replacing. Generate once with
          # `cargo tauri signer generate` and add these secrets. Absent → an
          # unsigned, non-auto-updating (but runnable) build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy strips every binary in the AppDir by default and chokes on
          # the bun-compiled server sidecar ("failed to run linuxdeploy", tauri-v2.1.0
          # take-2). Bun single-file executables embed their JS payload past the ELF
          # sections and don't survive strip anyway. Linux-only effect.
          NO_STRIP: true
          # macOS code signing + notarization — ARMED, activates when the secrets
          # exist. tauri-action only signs when APPLE_CERTIFICATE is a NON-EMPTY
          # string; until the secrets are set these all resolve to "" and the
          # macOS job ships unsigned exactly as before (no import, no failure).
          # This is safe precisely because we DON'T reuse the old MAC_CSC_LINK
          # org secret: the tauri-v2.1.0 run proved that value is electron-builder's
          # CSC_LINK format, NOT an importable .p12 for tauri-action (`security
          # import: failed to import keychain certificate`), and a broken non-empty
          # value fails the whole macOS job instead of skipping. New APPLE_* names
          # start empty, so arming them here cannot re-trigger that break.
          #
          # To go LIVE (signed + notarized so macOS 26 grants UserNotifications):
          #   APPLE_CERTIFICATE          — base64 of a "Developer ID Application" .p12
          #   APPLE_CERTIFICATE_PASSWORD — the .p12 export password
          #   APPLE_SIGNING_IDENTITY     — e.g. "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID / APPLE_PASSWORD  — Apple ID + app-specific password (notarize)
          #   APPLE_TEAM_ID              — 10-char team id
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop-tauri
          # Upload into the pre-made draft (by id) — no per-job createRelease, no
          # race. tagName keeps the updater artifact naming tied to the version;
          # releaseDraft: true because the target release is still a draft here
          # (the publish job flips it live once every OS has uploaded).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Flip the draft to published — only reached if every matrix build succeeded, so
  # a partially-built version never goes live to the auto-updater.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$REPO/releases/$ID" -F draft=false -f make_latest=true --jq '.html_url'
