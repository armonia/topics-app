name: Release (Tauri)

# Builds the Tauri desktop installers (macOS Universal + Windows + Linux) and the
# `latest.json` auto-update manifest, and PUBLISHES them to a GitHub Release so
# the signed auto-updater picks them up immediately.
#
# Three-stage on purpose (create-release → build matrix → publish):
#   • create-release makes ONE draft release up front and hands its id to the
#     builders. The old single-stage matrix had all three OS jobs call
#     tauri-action's own createRelease for the same tag concurrently — a race that
#     started returning 403 "Resource not accessible by integration" (the token
#     has contents:write and `gh api` create works fine; the concurrent
#     create-a-release calls do not). Creating once, then uploading by releaseId,
#     removes the race.
#   • publish flips the draft to published only AFTER every OS built, so a
#     half-built version never goes live.
#
# Fired three ways:
#   • After every merge to main: auto-bump.yml calls this as a reusable workflow
#     (workflow_call) with the freshly-bumped commit + tag → every version ships
#     to everyone automatically. The build runs INSIDE the human-merge run on
#     purpose: CI's built-in GITHUB_TOKEN can't trigger a tag- or dispatch-driven
#     workflow, and we deliberately use no repo PAT.
#   • `scripts/ship.sh` (or a hand-pushed `tauri-vX.Y.Z` tag) — one-off release.
#   • workflow_dispatch — manual (re-)run from the Actions tab.
on:
  push:
    tags: ['tauri-v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit/branch to build (blank = this ref)'
        required: false
        default: ''
      tag:
        description: 'Release tag, e.g. tauri-v2.1.9 (blank = this ref name)'
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA to build (the bumped commit)'
        required: true
        type: string
      tag:
        description: 'Release tag to publish, e.g. tauri-v2.1.9'
        required: true
        type: string

permissions:
  contents: write # GITHUB_TOKEN creates + publishes the GitHub Release

jobs:
  # Create (or reuse) the single draft release for this version and export its id.
  # Uses `gh api` — proven to work with the run's contents:write token — instead of
  # tauri-action's own createRelease, and does it once to avoid the matrix race.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.mk.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release
        id: mk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # tag: explicit on workflow_call (github.ref_name is "main" there); the
          # ref name on a tag push / dispatch. commitish: the exact commit to tag
          # (the bumped commit on workflow_call; the tag's own commit otherwise).
          TAG: ${{ inputs.tag || github.ref_name }}
          COMMITISH: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$REPO/releases" \
                 --jq "map(select(.tag_name==\"$TAG\")) | .[0].id // empty")"
          if [ -z "$id" ]; then
            id="$(gh api -X POST "repos/$REPO/releases" \
                    -f tag_name="$TAG" \
                    -f target_commitish="$COMMITISH" \
                    -f name="Topics ${TAG#tauri-}" \
                    -F draft=true -F prerelease=false --jq .id)"
            echo "Created draft release $id for $TAG @ $COMMITISH"
          else
            echo "Reusing existing draft release $id for $TAG"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE Universal macOS build (arm64 + x86_64) on Apple Silicon, mirroring
          # the Electron job — a single universal .app/.dmg → one correct
          # latest.json updater manifest (two arch jobs would race to clobber it).
          - { os: macos-14, args: '--target universal-apple-darwin' }
          - { os: windows-latest, args: '' }
          # deb + rpm only: AppImage bundling runs linuxdeploy, which fails
          # opaquely on the ~100MB bun server sidecar even with NO_STRIP
          # (takes 2 and 3 of tauri-v2.1.0). deb+rpm don't use linuxdeploy.
          - { os: ubuntu-latest, args: '--bundles deb,rpm' }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      # workflow_call passes the bumped commit SHA; a tag push resolves the tag;
      # dispatch uses its (optional) input or the selected ref. inputs.* is the
      # trusted output of auto-bump (git rev-parse) or a manual dispatch — never
      # external/untrusted content, so it's safe in ref:.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS needs both arch std libs; empty elsewhere.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop-tauri/src-tauri
            desktop-tauri/pty-bridge
            desktop-tauri/webrtc-bridge

      - name: Linux WebKitGTK + tray build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install server deps (for the sidecar compile)
        run: bun install --frozen-lockfile

      # Compile the Bun server into a self-contained sidecar binary named with the
      # Rust target triple Tauri's externalBin expects. WITHOUT this the installed
      # app serves the UI but has no data server on a virgin machine (blank
      # "connecting"). macOS builds a UNIVERSAL sidecar (arm64+x86_64 via lipo) to
      # match the universal .app. See scripts/build-server-sidecar.sh + PORTING-PLAN
      # W-A. The script also regenerates the embedded-migrations manifest first.
      - name: Build server sidecar (macOS universal)
        if: runner.os == 'macOS'
        run: ./scripts/build-server-sidecar.sh macos
      - name: Build server sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build-server-sidecar.sh windows
      - name: Build server sidecar (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-server-sidecar.sh linux

      # Build the standalone Rust PTY-bridge sidecar (binaries/pty-bridge-<triple>).
      # WITHOUT this the standalone sidecar on a virgin machine can't spawn a PTY
      # bridge (the compiled Bun server can't run node-pty) and shell/claude-code tabs
      # never open. A ~0.5 MB wire-compatible port of pty-bridge.mjs. See
      # scripts/build-pty-bridge.sh + desktop-tauri lib.rs bundled_pty_bridge_bin().
      # Must run BEFORE tauri build so the externalBin (tauri.conf.json) resolves.
      # Windows compiles a no-op stub (bridge is Unix-socket only) just to satisfy the
      # per-target externalBin bundle; lib.rs never spawns it there.
      - name: Build PTY bridge sidecar (macOS universal)
        if: runner.os == 'macOS'
        run: ./scripts/build-pty-bridge.sh macos
      - name: Build PTY bridge sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build-pty-bridge.sh windows
      - name: Build PTY bridge sidecar (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-pty-bridge.sh linux

      # Build the standalone Rust WebRTC-bridge sidecar (binaries/webrtc-bridge-<triple>).
      # WITHOUT this the browser pane on a virgin install has no shared-session video
      # transport: server/webrtc-bridge.ts finds no binary, available() is false, every
      # SDP offer is dropped and the pane degrades to the DOM fallback. See
      # scripts/build-webrtc-bridge.sh + desktop-tauri lib.rs bundled_webrtc_bridge_bin().
      # Must run BEFORE tauri build so the externalBin (tauri.conf.json) resolves.
      # Windows compiles a no-op stub (the wire protocol is a Unix socket) just to
      # satisfy the per-target externalBin bundle; lib.rs never advertises it there.
      - name: Build WebRTC bridge sidecar (macOS universal)
        if: runner.os == 'macOS'
        run: ./scripts/build-webrtc-bridge.sh macos
      - name: Build WebRTC bridge sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build-webrtc-bridge.sh windows
      - name: Build WebRTC bridge sidecar (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-webrtc-bridge.sh linux

      - name: Build client (Vite → public/, the Tauri frontendDist)
        working-directory: client
        run: |
          bun install --frozen-lockfile
          bun run build

      # Esporta le variabili della firma macOS SOLO se un certificato c'è.
      #
      # Perché non basta metterle nell'`env:` del passo dopo: in Actions una
      # chiave con valore vuoto è comunque DEFINITA, e per tauri-action una
      # `APPLE_CERTIFICATE` definita è una richiesta di firmare — anche vuota.
      # Il 2026-08-02 la build macOS moriva proprio lì, con zero secret APPLE_*
      # configurati, e trascinava con sé la pubblicazione di Windows e Linux
      # (`publish` dipende da tutte e tre). Passando da $GITHUB_ENV la chiave
      # semplicemente NON esiste finché non c'è un certificato, e la build macOS
      # esce non firmata invece di non uscire.
      #
      # I secret entrano come `env:` di QUESTO passo e si leggono come variabili
      # di shell: mai interpolati dentro `run:`.
      - name: Prepara la firma macOS (solo se il certificato c'è)
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "Nessun APPLE_CERTIFICATE: la build macOS esce NON FIRMATA."
            echo "Conseguenza da sapere: senza un'identità stabile il requisito"
            echo "designato è l'hash della build, quindi a ogni aggiornamento"
            echo "macOS richiede di nuovo notifiche/schermo/accessibilità."
            exit 0
          fi
          # Il certificato lo importiamo NOI, non tauri-action, perché va anche
          # reso FIDATO — e questo tauri-action non lo fa.
          #
          # Il perché, imparato a spese di una release: `codesign -s "Nome"`
          # firma benissimo con un certificato autofirmato non fidato (la
          # fiducia riguarda la validazione della catena, non la capacità di
          # firmare). Ma il bundler di Tauri non chiama codesign alla cieca:
          # prima RISOLVE l'identità con `security find-identity -v`, e quel
          # `-v` elenca solo le identità VALIDE. Un certificato autofirmato è
          # `CSSMERR_TP_NOT_TRUSTED`, quindi non compare, e la build muore con
          # «failed to resolve signing identity» pur avendo appena importato la
          # chiave («1 identity imported»). Serve la fiducia — che su un runner
          # si aggiunge senza interazione, mentre su un Mac vero chiederebbe
          # conferma.
          #
          # Ogni fallimento qui è NON fatale: si esce senza esportare
          # APPLE_SIGNING_IDENTITY, la build macOS viene non firmata e la
          # release esce comunque. Perdere Windows e Linux per un problema di
          # firma è il guasto che questo passo esiste per evitare.
          set +e
          WORKDIR="$RUNNER_TEMP/signing"
          mkdir -p "$WORKDIR"
          printf '%s' "$CERT" | base64 --decode > "$WORKDIR/cert.p12"
          KEYCHAIN="$WORKDIR/topics-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"

          setup_signing() {
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN" || return 1
            security set-keychain-settings -lut 21600 "$KEYCHAIN" || return 1
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN" || return 1
            # In lista di ricerca INSIEME alle altre: `find-identity` guarda lì.
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"') || return 1
            security import "$WORKDIR/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security || return 1
            # Senza questo, il primo accesso alla chiave privata aprirebbe un
            # dialogo di consenso — su un runner headless significa restare
            # appesi fino al timeout del job.
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null || return 1
            # La FIDUCIA: senza, `find-identity -v` non la elenca (vedi sopra).
            #
            # Il PEM si rilegge dal portachiavi in cui l'abbiamo appena
            # importato, non estratto dal .p12 con openssl: l'`openssl` di macOS
            # è LibreSSL e non conosce `-legacy` (è di OpenSSL 3). Con quel flag
            # il comando falliva — `pkcs12: Unrecognized flag legacy` — e la
            # build usciva non firmata; senza, non aprirebbe un .p12 scritto con
            # gli algoritmi vecchi. `security` non ha questo problema perché la
            # chiave è già dentro.
            security find-certificate -c "$SIGNING_IDENTITY" -p "$KEYCHAIN" > "$WORKDIR/cert.pem" || return 1
            [ -s "$WORKDIR/cert.pem" ] || return 1
            sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain "$WORKDIR/cert.pem" || return 1
            return 0
          }

          if ! setup_signing; then
            echo "::warning::Firma macOS non configurabile — la build esce NON FIRMATA (release comunque pubblicata)."
            rm -f "$WORKDIR/cert.p12" "$WORKDIR/cert.pem"
            exit 0
          fi
          rm -f "$WORKDIR/cert.p12" "$WORKDIR/cert.pem"

          # Prova che l'identità è ora RISOLVIBILE come la cercherà Tauri.
          if ! security find-identity -v -p codesigning | grep -qF "$SIGNING_IDENTITY"; then
            echo "::warning::«$SIGNING_IDENTITY» non risulta valida dopo l'import — build NON FIRMATA."
            security find-identity -p codesigning | sed 's/^/  /'
            exit 0
          fi
          echo "Identità di firma risolta: la build macOS verrà firmata."

          # NB: si esporta SOLO l'identità. Passando anche APPLE_CERTIFICATE,
          # tauri-action rifarebbe il proprio import in un ALTRO portachiavi —
          # senza fiducia, quindi di nuovo irrisolvibile.
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          # La notarizzazione è un passo a parte e richiede un account Apple a
          # pagamento: si arma solo se TUTTE e tre le sue variabili ci sono,
          # altrimenti tauri-action ci prova e fallisce a fine build.
          if [ -n "$APPLE_ID_SECRET" ] && [ -n "$APPLE_PASSWORD_SECRET" ] && [ -n "$APPLE_TEAM_ID_SECRET" ]; then
            {
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
          else
            echo "Notarizzazione non configurata: firma sì, notarizzazione no."
          fi

      - name: Build Tauri + upload to the draft release (signed when secrets present)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign) — REQUIRED for auto-update to verify the
          # downloaded bundle before self-replacing. Generate once with
          # `cargo tauri signer generate` and add these secrets. Absent → an
          # unsigned, non-auto-updating (but runnable) build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy strips every binary in the AppDir by default and chokes on
          # the bun-compiled server sidecar ("failed to run linuxdeploy", tauri-v2.1.0
          # take-2). Bun single-file executables embed their JS payload past the ELF
          # sections and don't survive strip anyway. Linux-only effect.
          NO_STRIP: true
          # macOS code signing — le variabili le esporta il passo «Prepara la
          # firma macOS» qui sopra, e SOLO se un certificato c'è davvero.
          #
          # Qui prima stavano come `APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}`,
          # col commento «until the secrets are set these all resolve to "" and
          # the macOS job ships unsigned exactly as before (no import, no
          # failure)». Il 2026-08-02 si è visto che non è vero: nel repo non
          # esiste NESSUN secret APPLE_* (c'è solo TAURI_SIGNING_PRIVATE_KEY) e
          # la build macOS moriva lo stesso con
          #     failed codesign application: failed to run command security
          #     import: failed to import keychain certificate
          # perché per tauri-action la chiave DEFINITA-ma-vuota è comunque una
          # richiesta di firmare. E poiché `publish` dipende da tutte e tre le
          # build, quel fallimento buttava via anche Windows e Linux, che erano
          # verdi: nessuna release usciva. Una chiave non definita non ha questo
          # problema — ed è l'unico modo di ottenerla, in Actions, passando da
          # $GITHUB_ENV.
        with:
          projectPath: desktop-tauri
          # Upload into the pre-made draft (by id) — no per-job createRelease, no
          # race. tagName keeps the updater artifact naming tied to the version;
          # releaseDraft: true because the target release is still a draft here
          # (the publish job flips it live once every OS has uploaded).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Porta la draft in pubblicata. IL CANCELLO SONO GLI ASSET, non l'exit code
  # dei build.
  #
  # Prima era `needs: [create-release, build]` e basta, cioe' «pubblica se tutti
  # e tre i job sono usciti zero». Il 2026-08-14 la tauri-v2.2.131 ha caricato
  # tutti e dodici i suoi asset e POI il job Windows ha preso un
  # `##[error]Server Error` dall'API di GitHub UNDICI SECONDI dopo l'ultimo
  # upload riuscito: tauri-action e' uscito non-zero, questo job e' stato
  # saltato, e una build completa su tre OS e' rimasta draft per sempre —
  # nessun tag, un buco nella catena di versioni, l'updater fermo.
  #
  # L'exit code risponde a «il processo e' finito bene». La domanda vera e' «c'e'
  # tutto quello che serve a un utente per aggiornare», e a quella rispondono
  # gli asset presenti sulla release.
  #
  # NON E' UN ALLENTAMENTO. Il gate vecchio proteggeva da una cosa reale — una
  # release PARZIALE che va live e' peggio di una mancata, perche' l'updater la
  # serve a tutti e chi la scarica trova meta' dei formati. Quel controllo resta
  # e diventa piu' stretto: si contano i dodici asset uno per uno, firme
  # comprese, e ne basta uno mancante per non pubblicare. Cambia solo cosa si
  # misura.
  #
  # `if: always()` insieme a `needs: build`: senza `always()` il job non
  # partirebbe proprio quando un build e' rosso, che e' precisamente il caso da
  # recuperare. `create-release` deve invece essere riuscito davvero — senza la
  # sua `release_id` non c'e' niente da misurare ne' da pubblicare.
  publish:
    needs: [create-release, build]
    if: ${{ always() && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Esce 0 completa, 1 incompleta (e dice QUALE manca), 2 non misurabile.
      # Il 2 e' distinto apposta: «non lo so» non e' «no», e qui si e' scelto di
      # non pubblicare comunque — a differenza dei pavimenti sulle risorse, dove
      # non sapere lascia passare, qui l'errore costa un aggiornamento rotto su
      # tutte le macchine invece di una card che aspetta.
      - name: Gli asset attesi ci sono tutti?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.create-release.outputs.release_id }}
        run: bun run scripts/check-release-assets.ts "$ID"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$REPO/releases/$ID" -F draft=false -f make_latest=true --jq '.html_url'
