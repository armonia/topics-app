name: Rete per i runner della CI

# Ogni ora: toglie le prenotazioni dei runner del nodo permanente rimaste da run finite
# (un delete saltato non deve tenere un runner fermo per sempre) e toglie da GitHub i
# runner gh-runner-* dei vecchi server a richiesta rimasti offline.
# Dall'11/11 la CI non crea più server Hetzner: quelli effimeri rimasti li cancella
# `hetzner-tetto giro` sul Mac, che ha il token. Qui non c'è nessun token Hetzner.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    # ubuntu-latest: repo pubblico, minuti gratis, e nessuna macchina nostra vede i token.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci-permanent-reserve.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prenotazioni di run finite sui runner del nodo permanente
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          source scripts/ci-permanent-reserve.sh
          all=$(runners) && drop_stale "$all"
          runners | jq -r '.runners[] | select(.name | startswith("topics-permanent-node")) | "\(.name) \(.status) busy=\(.busy) \([.labels[].name] | join(","))"'

      - name: Togli da GitHub i runner effimeri offline
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api?per_page=100" \
            | jq -r '.runners[] | select((.name | startswith("gh-runner-")) and .status == "offline") | "\(.id) \(.name)"' \
            | while read -r id name; do
                curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/$id" && echo "tolto $name"
              done
