name: Diagnosi permessi release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnosi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cosa puo' fare il GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "--- 1. GET releases (lettura) ---"
          gh api "repos/$REPO/releases" --jq 'length' ; echo "exit=$?"
          echo "--- 2. GET repo (metadata) ---"
          gh api "repos/$REPO" --jq .full_name ; echo "exit=$?"
          echo "--- 3. POST release bozza (scrittura) ---"
          gh api -X POST "repos/$REPO/releases" -f tag_name="zz-diag-$GITHUB_RUN_ID" -f name="diagnosi" -F draft=true -F prerelease=true --jq .id
          echo "exit=$?"
          echo "--- 4. header di autorizzazione visto dall'API ---"
          gh api rate_limit --jq '.resources.core.limit' ; echo "exit=$?"
