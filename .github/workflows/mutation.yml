name: Mutation (indice solido)

# L'indice «solido»: il mutation score dei moduli critici (scripts/mutation-critical.ts).
# Gira ogni notte su main e sulle PR che toccano quei moduli o i loro test. Rosso se un
# modulo scende sotto la sua baseline (scripts/mutation-baseline.json). Di notte, se uno
# sale, la baseline sale con lui e il commit va su main: il ratchet si stringe da solo.
# quality-bar legge l'ultimo giro finito su main (misura `mutation-main`).

on:
  schedule:
    - cron: "41 2 * * *" # 02:41 UTC, prima dell'e2e notturno
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/mutation-critical.ts"
      - "scripts/mutation-baseline.json"
      - "scripts/check-mutation.ts"
      - "stryker.config.mjs"
      - "server/services/landing-verdict*.ts"
      - "server/services/landing-files*.ts"
      - "server/services/dispatch-card-price*.ts"
      - "server/services/dispatch-card-weight*.ts"
      - "server/services/dispatch-topic-identity*.ts"
      - "server/providers/native/permissions*.ts"

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node (node-pty native bridge used by server tests)
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install server deps (root)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Rebuild node-pty (Linux)
        run: npm rebuild node-pty

      - name: Rimetti il bit +x sugli spawn-helper (il postinstall e' stato saltato)
        run: bun run scripts/fix-node-pty-exec-bit.ts

      - name: I moduli del recinto e quelli del filtro pull_request coincidono
        run: bun run scripts/check-mutation.ts --paths-match .github/workflows/mutation.yml

      - name: Stryker sui moduli critici
        run: bun run mutation --concurrency 4

      - name: Ratchet contro la baseline
        run: bun run check:mutation

      - name: Score salito, la baseline lo segue (solo di notte su main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          bun run check:mutation --update-baseline
          if git diff --quiet scripts/mutation-baseline.json; then exit 0; fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add scripts/mutation-baseline.json
          git commit -m "mutation: la baseline segue gli score saliti stanotte"
          git push origin HEAD:main || echo "::warning::main si e' mosso, la baseline sale al prossimo giro"

      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
