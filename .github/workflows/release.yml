name: Release

# Tag a version to build & publish installers for all 3 platforms, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag MUST match electron-app/package.json "version" or electron-updater
# (which compares against the published latest*.yml) will mismatch.
#
# Bumping the version on main also releases automatically: auto-tag.yml
# creates the matching tag and dispatches this workflow on it (tags pushed
# with GITHUB_TOKEN don't fire on:push:tags, so the dispatch is explicit).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # lets GITHUB_TOKEN create the GitHub Release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE Universal macOS build (x86_64 + arm64) on Apple Silicon. GitHub
          # retired the macos-13 Intel runner, so x64 can't be built on its own
          # box; instead stage-server-dist stages fat bun/node (lipo) and node-pty
          # ships both darwin prebuilds. A single universal dmg also yields one
          # correct latest-mac.yml (two arch jobs raced to clobber it).
          - { os: macos-14,       builder_flag: '--mac --universal', universal: true }   # Apple Silicon + Intel
          - { os: windows-latest, builder_flag: '--win --x64'  }
          - { os: ubuntu-latest,  builder_flag: '--linux'      }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (electron-builder + node-pty bridge runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server deps (root)
        run: bun install --frozen-lockfile

      # node-pty ships no Linux prebuild — rebuild it against the bundled Node.
      - name: Rebuild node-pty (Linux only)
        if: runner.os == 'Linux'
        run: npm rebuild node-pty

      - name: Install + build client (Vite → public/)
        run: |
          bun install --frozen-lockfile
          bun run build
        working-directory: client

      - name: Install electron-app deps
        run: bun install --frozen-lockfile
        working-directory: electron-app

      - name: Build Electron main (TypeScript)
        run: bun run build:ts
        working-directory: electron-app

      - name: Stage bundled server (runtime + source + node_modules + cert)
        run: bun run stage:server
        working-directory: electron-app
        env:
          # macOS universal job → stage fat (x86_64+arm64) bun & node. Empty
          # elsewhere → native host-arch copy (unchanged).
          STAGE_UNIVERSAL: ${{ matrix.universal && '1' || '' }}

      - name: Build & publish installers
        run: npx --yes electron-builder ${{ matrix.builder_flag }} --publish always
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization — REQUIRED for macOS auto-update to
          # self-replace. electron-builder skips signing when these are empty,
          # so unsigned builds still produce runnable (Gatekeeper-warned) artifacts.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (optional — unsigned NSIS still auto-updates, but
          # SmartScreen warns on first run).
          CSC_LINK_WIN: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
