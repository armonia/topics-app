name: Sonda z-order GTK (wkzprobe, Linux)

# L'ULTIMO ENGINES-GAP, MISURATO DOVE SI PUO' MISURARE.
#
# La card 8c8ef676 chiede se `browser_linux::raise` serva a qualcosa su
# WebKitGTK. Non si puo' rispondere dal Mac: niente Docker li', e un verdetto
# letto su un'altra piattaforma sarebbe finto. Qui gira dove il codice vive.
#
# COSA ASPETTARSI, ed e' scritto prima di premere il bottone cosi' nessuno puo'
# raccontarsela dopo. Sotto GTK la shell impacchetta le webview con
# `pack_start` in un GtkBox (wry 0.55.1 `webkitgtk/mod.rs`, via
# `build_gtk(default_vbox())` di tauri-runtime-wry 2.11.3): due widget packed
# NON si sovrappongono, quindi non c'e' uno z order da alzare. Il verdetto
# atteso sul raise e' NO, e un no misurato e' il risultato che la card chiede:
# «se sotto GTK nessuna chiamata riordina due webview impacchettate nel vbox,
# e' un risultato: si dichiara il buco con la misura invece di chiuderlo».
#
# Il falsificato e' nello stesso workflow, e serve a distinguere «la sonda dice
# no» da «la sonda non guarda»: con la chiamata tolta il verdetto deve restare
# identico, perche' sotto GTK quella chiamata non stava facendo niente. Se
# invece CAMBIASSE, il no di sopra sarebbe falso e la sonda lo direbbe.
on:
  workflow_dispatch:
    inputs:
      arm:
        description: "Quale braccio: z (z-order) o drag"
        required: false
        default: "z"

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dipendenze di sistema (WebKitGTK + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            xvfb

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache di cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/wkzprobe/target
          key: wkzprobe-gtk-${{ hashFiles('tools/wkzprobe/Cargo.toml') }}

      - name: Compila la sonda
        working-directory: tools/wkzprobe
        run: cargo build --release

      # `|| true` sull'uscita, e il motivo va scritto: wkzprobe esce 1 quando non
      # tutti e sei i verdetti sono `true`, ed e' la regola giusta su macOS e
      # Windows, dove una webview figlia E' una finestra e lo z order esiste.
      # Sotto GTK quattro di quei sei sono `false` PER COSTRUZIONE - `pack_start`
      # impila i widget uno sotto l'altro e non c'e' niente da alzare - quindi
      # qui l'exit 1 non dice «guasto», dice «piattaforma diversa». Il verdetto
      # vero lo da' il confronto col falsificato, due step piu' sotto, che e'
      # l'unica cosa che distingue «il raise non fa niente» da «la sonda non
      # guarda». L'output grezzo resta, ed e' quello che si cita.
      - name: Misura (sotto Xvfb)
        working-directory: tools/wkzprobe
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            ./target/release/wkzprobe ${{ inputs.arm }} 2>&1 | tee ../../wkzprobe-gtk.txt || true

      # IL FALSIFICATO, e non e' cerimonia: una sonda che stampa «no» senza
      # guardare stampa lo stesso «no» di una che guarda. Qui la chiamata di
      # raise viene tolta e la misura rifatta: sotto GTK il verdetto deve
      # restare IDENTICO (la chiamata non faceva niente), e se cambia il
      # risultato di sopra e' da buttare.
      - name: Falsificato (raise tolto)
        working-directory: tools/wkzprobe
        run: |
          set -o pipefail
          cp src/views_gtk.rs /tmp/views_gtk.bak
          perl -0pi -e 's/            gdk_window\.raise\(\);/            \/\/ falsificato: chiamata tolta/' src/views_gtk.rs
          perl -0pi -e 's/        vbox\.reorder_child\(&target, n - 1\);/        \/\/ falsificato: reorder tolto/' src/views_gtk.rs
          cargo build --release
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            ./target/release/wkzprobe ${{ inputs.arm }} 2>&1 | tee ../../wkzprobe-gtk-falsificato.txt || true
          cp /tmp/views_gtk.bak src/views_gtk.rs

      - name: Confronto dei due verdetti
        run: |
          echo "=== MISURA ==="
          grep -E '^(verdict|==|   )' wkzprobe-gtk.txt || cat wkzprobe-gtk.txt
          echo
          echo "=== FALSIFICATO ==="
          grep -E '^(verdict|==|   )' wkzprobe-gtk-falsificato.txt || cat wkzprobe-gtk-falsificato.txt
          echo
          # Il confronto guarda UNA riga per volta, non il blocco intero, perche'
          # le due domande sono diverse: «il raise alza?» e «il raise fa danni
          # altrove?». La prima corsa completa (run 35436598073) ha risposto no
          # alla prima e SI alla seconda, e un diff sul blocco le avrebbe
          # impastate in un «differiscono» che non dice quale.
          estrai() { grep -E "^   $2=" "$1" | head -1; }
          for riga in raise-wins first-responder-survives-the-raise newcomer-covers-raised page-survives-the-raise created-last-on-top set_bounds-does-not-reorder; do
            a=$(estrai wkzprobe-gtk.txt "$riga")
            b=$(estrai wkzprobe-gtk-falsificato.txt "$riga")
            if [ "$a" = "$b" ]; then
              echo "  =  $riga: identico con e senza raise"
            else
              echo "  != $riga: con raise ->$a | senza ->$b"
            fi
          done
          echo
          rw=$(grep -E '^   raise-wins=' wkzprobe-gtk.txt | head -1)
          if [ "$rw" = "   raise-wins=false" ]; then
            echo "VERDETTO: sotto GTK il raise NON alza niente."
            echo "Le webview sono impilate da pack_start e non si sovrappongono:"
            echo "non c'e' uno z order da vincere. Il gap va DICHIARATO, non chiuso."
          else
            echo "VERDETTO: il raise alza davvero. Il gap si puo' chiudere, e questo"
            echo "output e' la prova da citare in PINNED_GAPS."
          fi

      - name: Carica l'output grezzo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wkzprobe-gtk
          path: |
            wkzprobe-gtk.txt
            wkzprobe-gtk-falsificato.txt
          if-no-files-found: error
          retention-days: 30
