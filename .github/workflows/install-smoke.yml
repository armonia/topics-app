name: Install smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to install, or latest
        required: true
        default: latest
        type: string
  # The release is published with the GITHUB_TOKEN inside "Auto-bump patch" (workflow_call), and
  # an event raised by that token starts no workflow: `release: published` would never fire here.
  workflow_run:
    workflows: [Auto-bump patch]
    types: [completed]

permissions:
  contents: read

jobs:
  select-releases:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.select.outputs.current }}
      previous: ${{ steps.select.outputs.previous }}
      skip: ${{ steps.select.outputs.skip }}
    steps:
      - name: Select current and previous published releases
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || 'latest' }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # Auto-bump runs every 10 minutes and publishes only when main moved: go on only for a
            # release published after that run started.
            read -r current published < <(gh api "repos/$REPOSITORY/releases/latest" --jq '"\(.tag_name) \(.published_at)"')
            if [[ "$published" < "$RUN_STARTED_AT" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Nessuna release pubblicata da questo giro di auto-bump (ultima: $current, $published)"
              exit 0
            fi
          elif [ "$REQUESTED_TAG" = latest ]; then
            current="$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)"
          else
            current="$REQUESTED_TAG"
          fi

          releases="$(gh api "repos/$REPOSITORY/releases?per_page=100")"
          tags="$(jq -c '[.[] | select(.draft == false and .prerelease == false) | .tag_name]' <<< "$releases")"
          index="$(jq -r --arg tag "$current" 'index($tag) // empty' <<< "$tags")"
          if [ -z "$index" ]; then
            echo "::error title=Selezione release::Release pubblicata non trovata: $current"
            exit 1
          fi
          previous="$(jq -r --argjson index "$index" '.[$index + 1] // empty' <<< "$tags")"
          if [ -z "$previous" ]; then
            echo "::error title=Aggiornamento::Nessuna release pubblicata precedente a $current"
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Release da installare: $previous → $current"

  install-smoke:
    needs: select-releases
    if: needs.select-releases.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Resolve package asset for this system
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) pattern='Topics_*_universal.dmg' ;;
            Windows) pattern='Topics_*_x64_en-US.msi' ;;
            Linux) pattern='Topics_*_amd64.deb' ;;
            *) echo "::error title=Scaricamento::Sistema non supportato: $RUNNER_OS"; exit 1 ;;
          esac
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"

      - name: Download previous and current release packages
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.select-releases.outputs.previous }}
          CURRENT_TAG: ${{ needs.select-releases.outputs.current }}
          ASSET_PATTERN: ${{ steps.asset.outputs.pattern }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/install-smoke/previous" "$RUNNER_TEMP/install-smoke/current" "$RUNNER_TEMP/install-smoke/logs"
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_PATTERN" --dir "$RUNNER_TEMP/install-smoke/previous" || { echo "::error title=Scaricamento::Pacchetto $ASSET_PATTERN non scaricato dalla release $PREVIOUS_TAG"; exit 1; }
          gh release download "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_PATTERN" --dir "$RUNNER_TEMP/install-smoke/current" || { echo "::error title=Scaricamento::Pacchetto $ASSET_PATTERN non scaricato dalla release $CURRENT_TAG"; exit 1; }
          [ "$(find "$RUNNER_TEMP/install-smoke/previous" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1 ] || { echo "::error title=Scaricamento::La release $PREVIOUS_TAG non contiene un solo asset $ASSET_PATTERN"; exit 1; }
          [ "$(find "$RUNNER_TEMP/install-smoke/current" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1 ] || { echo "::error title=Scaricamento::La release $CURRENT_TAG non contiene un solo asset $ASSET_PATTERN"; exit 1; }

      - name: Install previous release
        if: runner.os != 'Windows'
        env:
          PREVIOUS_TAG: ${{ needs.select-releases.outputs.previous }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(find "$RUNNER_TEMP/install-smoke/previous" -maxdepth 1 -type f | head -1)"
          if [ "$RUNNER_OS" = macOS ]; then
            mount="$RUNNER_TEMP/install-smoke/mount"
            mkdir -p "$mount"
            hdiutil attach "$package" -nobrowse -quiet -mountpoint "$mount" || { echo "::error title=Installazione::Montaggio DMG di $PREVIOUS_TAG fallito"; exit 1; }
            app="$mount/Topics.app"
            [ -d "$app" ] || { hdiutil detach "$mount" -quiet || true; echo "::error title=Installazione::Topics.app assente nel DMG $PREVIOUS_TAG"; exit 1; }
            sudo rm -rf /Applications/Topics.app
            sudo ditto "$app" /Applications/Topics.app || { hdiutil detach "$mount" -quiet || true; echo "::error title=Installazione::Copia di Topics.app $PREVIOUS_TAG fallita"; exit 1; }
            hdiutil detach "$mount" -quiet
          else
            sudo apt-get install -y --no-install-recommends "$package" || { echo "::error title=Installazione::Installazione .deb $PREVIOUS_TAG fallita"; exit 1; }
          fi

      - name: Install previous release on Windows
        if: runner.os == 'Windows'
        env:
          PREVIOUS_TAG: ${{ needs.select-releases.outputs.previous }}
        shell: pwsh
        run: |
          $package = Get-ChildItem "$env:RUNNER_TEMP/install-smoke/previous" -File | Select-Object -First 1
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $package.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { Write-Error "Installazione MSI $env:PREVIOUS_TAG fallita (msiexec $($install.ExitCode))"; exit 1 }

      - name: Start and stop previous installed server
        if: runner.os != 'Windows'
        env:
          PREVIOUS_TAG: ${{ needs.select-releases.outputs.previous }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            binary=/Applications/Topics.app/Contents/MacOS/topics-server
            index="$(find /Applications/Topics.app/Contents/Resources -path '*/public/index.html' | head -1)"
          else
            package_name="$(dpkg-deb -f "$(find "$RUNNER_TEMP/install-smoke/previous" -maxdepth 1 -type f | head -1)" Package)"
            binary="$(dpkg -L "$package_name" | awk '/\/topics-server$/ { print; exit }')"
            index="$(dpkg -L "$package_name" | awk '/\/public\/index\.html$/ { print; exit }')"
          fi
          [ -x "$binary" ] || { echo "::error title=Avvio::Sidecar topics-server non trovato dopo l'installazione di $PREVIOUS_TAG"; exit 1; }
          # Started the way the app starts it (desktop-tauri/src-tauri/src/lib.rs): with the page the
          # package carries and the Rust PTY bridge beside it when there is one.
          [ -n "$index" ] || { echo "::error title=Installazione::public/index.html assente nell'installazione di $PREVIOUS_TAG"; exit 1; }
          bridge_env=(TOPICS_DISABLE_PTY_BRIDGE=1)
          if [ -x "$(dirname "$binary")/pty-bridge" ]; then bridge_env=(TOPICS_PTY_BRIDGE_BIN="$(dirname "$binary")/pty-bridge"); fi
          work="$RUNNER_TEMP/install-smoke/run-previous"
          log="$RUNNER_TEMP/install-smoke/logs/server-previous.log"
          mkdir -p "$work/home" "$work/data"
          port=18341
          (
            cd "$work"
            env NO_TLS=1 BUN_PORT="$port" SERVER_HOST=127.0.0.1 \
              TOPICS_DATA_DIR="$work/data" DATA_DIR="$work/data/data" TOPICS_HOME="$work/home" \
              TOPICS_PUBLIC_DIR="$(dirname "$index")" "${bridge_env[@]}" TOPICS_EMBEDDED=1 HOME="$work/home" \
              "$binary" > "$log" 2>&1
          ) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          code=''
          deadline=$((SECONDS + 18))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl --max-time 1 -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/topics" 2>/dev/null || true)"
            [ "$code" = 200 ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.25
          done
          if [ "$code" != 200 ]; then
            echo "::error title=Salute::Server installato $PREVIOUS_TAG non ha risposto 200 a GET /api/topics entro 20 s (HTTP ${code:-nessuna risposta})"
            cat "$log"
            exit 1
          fi
          page="$(curl --max-time 2 -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/" 2>/dev/null || true)"
          if [ "$page" != 200 ]; then
            echo "::error title=Salute::Server installato $PREVIOUS_TAG: GET / HTTP ${page:-nessuna risposta}, la finestra resterebbe grigia"
            cat "$log"
            exit 1
          fi
          echo "Salute $PREVIOUS_TAG: GET /api/topics HTTP $code, GET / HTTP $page, bridge: ${bridge_env[0]%%=*}"

      - name: Start and stop previous installed server on Windows
        if: runner.os == 'Windows'
        env:
          PREVIOUS_TAG: ${{ needs.select-releases.outputs.previous }}
        shell: pwsh
        run: |
          $binary = Get-ChildItem "$env:ProgramFiles\Topics" -Filter topics-server.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $binary) { $binary = Get-ChildItem "$env:ProgramFiles" -Filter topics-server.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $binary) { Write-Host "::error title=Avvio::topics-server.exe non trovato dopo l'installazione di $env:PREVIOUS_TAG"; exit 1 }
          # Started the way the app starts it (desktop-tauri/src-tauri/src/lib.rs): with the page the
          # package carries and the Rust PTY bridge beside it when there is one.
          $index = Get-ChildItem $binary.DirectoryName -Filter index.html -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'public' } | Select-Object -First 1
          if (-not $index) { Write-Host "::error title=Installazione::public/index.html assente nell'installazione di $env:PREVIOUS_TAG"; exit 1 }
          $bridge = Join-Path $binary.DirectoryName 'pty-bridge.exe'
          $work = Join-Path $env:RUNNER_TEMP 'install-smoke/run-previous'
          New-Item -ItemType Directory -Force "$work/home", "$work/data", "$env:RUNNER_TEMP/install-smoke/logs" | Out-Null
          $env:NO_TLS = '1'; $env:BUN_PORT = '18341'; $env:SERVER_HOST = '127.0.0.1'
          $env:TOPICS_DATA_DIR = "$work/data"; $env:DATA_DIR = "$work/data/data"; $env:TOPICS_HOME = "$work/home"
          $env:TOPICS_PUBLIC_DIR = $index.DirectoryName; $env:TOPICS_EMBEDDED = '1'; $env:HOME = "$work/home"
          if (Test-Path $bridge) { $env:TOPICS_PTY_BRIDGE_BIN = $bridge; $bridgeEnv = 'TOPICS_PTY_BRIDGE_BIN' } else { $env:TOPICS_DISABLE_PTY_BRIDGE = '1'; $bridgeEnv = 'TOPICS_DISABLE_PTY_BRIDGE' }
          $log = "$env:RUNNER_TEMP/install-smoke/logs/server-previous"
          $stdout = "$log.out.log"; $stderr = "$log.err.log"
          $process = Start-Process $binary.FullName -PassThru -WorkingDirectory $work -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $code = 0
          $deadline = [DateTime]::UtcNow.AddSeconds(19)
          while ([DateTime]::UtcNow -lt $deadline) {
            try { $code = (Invoke-WebRequest 'http://127.0.0.1:18341/api/topics' -UseBasicParsing -TimeoutSec 1).StatusCode; if ($code -eq 200) { break } } catch {}
            if ($process.HasExited) { break }
            Start-Sleep -Milliseconds 250
          }
          $page = 0
          if ($code -eq 200) { try { $page = (Invoke-WebRequest 'http://127.0.0.1:18341/' -UseBasicParsing -TimeoutSec 2).StatusCode } catch { $page = [int]$_.Exception.Response.StatusCode } }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 200 -or $page -ne 200) {
            Write-Host "::error title=Salute::Server installato $env:PREVIOUS_TAG: GET /api/topics HTTP $code, GET / HTTP $page (attesi 200 entro 20 s)"
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Salute $env:PREVIOUS_TAG: GET /api/topics HTTP 200, GET / HTTP 200, bridge: $bridgeEnv"

      - name: Install current release over previous
        if: runner.os != 'Windows'
        env:
          CURRENT_TAG: ${{ needs.select-releases.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(find "$RUNNER_TEMP/install-smoke/current" -maxdepth 1 -type f | head -1)"
          if [ "$RUNNER_OS" = macOS ]; then
            mount="$RUNNER_TEMP/install-smoke/mount"
            mkdir -p "$mount"
            hdiutil attach "$package" -nobrowse -quiet -mountpoint "$mount" || { echo "::error title=Aggiornamento::Montaggio DMG di $CURRENT_TAG fallito"; exit 1; }
            app="$mount/Topics.app"
            [ -d "$app" ] || { hdiutil detach "$mount" -quiet || true; echo "::error title=Aggiornamento::Topics.app assente nel DMG $CURRENT_TAG"; exit 1; }
            sudo rm -rf /Applications/Topics.app
            sudo ditto "$app" /Applications/Topics.app || { hdiutil detach "$mount" -quiet || true; echo "::error title=Aggiornamento::Sostituzione di Topics.app con $CURRENT_TAG fallita"; exit 1; }
            hdiutil detach "$mount" -quiet
          else
            sudo apt-get install -y --no-install-recommends "$package" || { echo "::error title=Aggiornamento::Installazione .deb $CURRENT_TAG sopra la versione precedente fallita"; exit 1; }
          fi

      - name: Install current release over previous on Windows
        if: runner.os == 'Windows'
        env:
          CURRENT_TAG: ${{ needs.select-releases.outputs.current }}
        shell: pwsh
        run: |
          $package = Get-ChildItem "$env:RUNNER_TEMP/install-smoke/current" -File | Select-Object -First 1
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $package.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { Write-Error "Aggiornamento MSI $env:CURRENT_TAG fallito (msiexec $($install.ExitCode))"; exit 1 }

      - name: Start and stop current installed server
        if: runner.os != 'Windows'
        env:
          CURRENT_TAG: ${{ needs.select-releases.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            binary=/Applications/Topics.app/Contents/MacOS/topics-server
            index="$(find /Applications/Topics.app/Contents/Resources -path '*/public/index.html' | head -1)"
          else
            package_name="$(dpkg-deb -f "$(find "$RUNNER_TEMP/install-smoke/current" -maxdepth 1 -type f | head -1)" Package)"
            binary="$(dpkg -L "$package_name" | awk '/\/topics-server$/ { print; exit }')"
            index="$(dpkg -L "$package_name" | awk '/\/public\/index\.html$/ { print; exit }')"
          fi
          [ -x "$binary" ] || { echo "::error title=Avvio::Sidecar topics-server non trovato dopo l'aggiornamento a $CURRENT_TAG"; exit 1; }
          # Started the way the app starts it (desktop-tauri/src-tauri/src/lib.rs): with the page the
          # package carries and the Rust PTY bridge beside it when there is one.
          [ -n "$index" ] || { echo "::error title=Installazione::public/index.html assente nell'installazione di $CURRENT_TAG"; exit 1; }
          bridge_env=(TOPICS_DISABLE_PTY_BRIDGE=1)
          if [ -x "$(dirname "$binary")/pty-bridge" ]; then bridge_env=(TOPICS_PTY_BRIDGE_BIN="$(dirname "$binary")/pty-bridge"); fi
          work="$RUNNER_TEMP/install-smoke/run-current"
          log="$RUNNER_TEMP/install-smoke/logs/server-current.log"
          mkdir -p "$work/home" "$work/data"
          port=18342
          (
            cd "$work"
            env NO_TLS=1 BUN_PORT="$port" SERVER_HOST=127.0.0.1 \
              TOPICS_DATA_DIR="$work/data" DATA_DIR="$work/data/data" TOPICS_HOME="$work/home" \
              TOPICS_PUBLIC_DIR="$(dirname "$index")" "${bridge_env[@]}" TOPICS_EMBEDDED=1 HOME="$work/home" \
              "$binary" > "$log" 2>&1
          ) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          code=''
          deadline=$((SECONDS + 18))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl --max-time 1 -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/topics" 2>/dev/null || true)"
            [ "$code" = 200 ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.25
          done
          if [ "$code" != 200 ]; then
            echo "::error title=Salute::Server installato $CURRENT_TAG non ha risposto 200 a GET /api/topics entro 20 s (HTTP ${code:-nessuna risposta})"
            cat "$log"
            exit 1
          fi
          page="$(curl --max-time 2 -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/" 2>/dev/null || true)"
          if [ "$page" != 200 ]; then
            echo "::error title=Salute::Server installato $CURRENT_TAG: GET / HTTP ${page:-nessuna risposta}, la finestra resterebbe grigia"
            cat "$log"
            exit 1
          fi
          echo "Salute $CURRENT_TAG: GET /api/topics HTTP $code, GET / HTTP $page, bridge: ${bridge_env[0]%%=*}"

      - name: Start and stop current installed server on Windows
        if: runner.os == 'Windows'
        env:
          CURRENT_TAG: ${{ needs.select-releases.outputs.current }}
        shell: pwsh
        run: |
          $binary = Get-ChildItem "$env:ProgramFiles\Topics" -Filter topics-server.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $binary) { $binary = Get-ChildItem "$env:ProgramFiles" -Filter topics-server.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $binary) { Write-Host "::error title=Avvio::topics-server.exe non trovato dopo l'aggiornamento a $env:CURRENT_TAG"; exit 1 }
          # Started the way the app starts it (desktop-tauri/src-tauri/src/lib.rs): with the page the
          # package carries and the Rust PTY bridge beside it when there is one.
          $index = Get-ChildItem $binary.DirectoryName -Filter index.html -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'public' } | Select-Object -First 1
          if (-not $index) { Write-Host "::error title=Installazione::public/index.html assente nell'installazione di $env:CURRENT_TAG"; exit 1 }
          $bridge = Join-Path $binary.DirectoryName 'pty-bridge.exe'
          $work = Join-Path $env:RUNNER_TEMP 'install-smoke/run-current'
          New-Item -ItemType Directory -Force "$work/home", "$work/data", "$env:RUNNER_TEMP/install-smoke/logs" | Out-Null
          $env:NO_TLS = '1'; $env:BUN_PORT = '18342'; $env:SERVER_HOST = '127.0.0.1'
          $env:TOPICS_DATA_DIR = "$work/data"; $env:DATA_DIR = "$work/data/data"; $env:TOPICS_HOME = "$work/home"
          $env:TOPICS_PUBLIC_DIR = $index.DirectoryName; $env:TOPICS_EMBEDDED = '1'; $env:HOME = "$work/home"
          if (Test-Path $bridge) { $env:TOPICS_PTY_BRIDGE_BIN = $bridge; $bridgeEnv = 'TOPICS_PTY_BRIDGE_BIN' } else { $env:TOPICS_DISABLE_PTY_BRIDGE = '1'; $bridgeEnv = 'TOPICS_DISABLE_PTY_BRIDGE' }
          $log = "$env:RUNNER_TEMP/install-smoke/logs/server-current"
          $stdout = "$log.out.log"; $stderr = "$log.err.log"
          $process = Start-Process $binary.FullName -PassThru -WorkingDirectory $work -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $code = 0
          $deadline = [DateTime]::UtcNow.AddSeconds(19)
          while ([DateTime]::UtcNow -lt $deadline) {
            try { $code = (Invoke-WebRequest 'http://127.0.0.1:18342/api/topics' -UseBasicParsing -TimeoutSec 1).StatusCode; if ($code -eq 200) { break } } catch {}
            if ($process.HasExited) { break }
            Start-Sleep -Milliseconds 250
          }
          $page = 0
          if ($code -eq 200) { try { $page = (Invoke-WebRequest 'http://127.0.0.1:18342/' -UseBasicParsing -TimeoutSec 2).StatusCode } catch { $page = [int]$_.Exception.Response.StatusCode } }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 200 -or $page -ne 200) {
            Write-Host "::error title=Salute::Server installato $env:CURRENT_TAG: GET /api/topics HTTP $code, GET / HTTP $page (attesi 200 entro 20 s)"
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Salute $env:CURRENT_TAG: GET /api/topics HTTP 200, GET / HTTP 200, bridge: $bridgeEnv"

      - name: Attach installed server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-logs-${{ runner.os }}
          path: ${{ runner.temp }}/install-smoke/logs/*.log
          if-no-files-found: warn
          retention-days: 7
