[package]
name = "webrtc-bridge"
version = "0.1.0"
edition = "2021"

# Standalone WebRTC bridge daemon — shares ONE server-side headless-Chromium pane
# (CDP :19222) to N peers over a WebRTC H.264 track instead of JPEG-over-WebSocket.
# Shipped as a Tauri externalBin sidecar (`binaries/webrtc-bridge-<triple>`) so the
# compiled Bun server, which can't hold an openh264 encoder / webrtc-rs stack in-proc,
# can still serve the shared browser session over WebRTC on a virgin install.
#
# Wire protocol: line-delimited JSON (NDJSON) over a Unix socket — byte-compatible with
# what `server/webrtc-bridge.ts` speaks. The server picks this binary via
# TOPICS_WEBRTC_BRIDGE_BIN (set by desktop-tauri lib.rs), same convention as pty-bridge.
#
# Pipeline (proven in spike/webrtc-cdp/): CDP screencast JPEG → zune-jpeg → openh264
# I420/H.264 → one shared TrackLocalStaticSample per CDP target → webrtc-rs fan-out to
# every peer. Non-trickle answer on LAN (host candidates); keepalive re-encode + IDR
# on new peer so static pages / late joiners still decode.

[[bin]]
name = "webrtc-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bytes = "1"
zune-jpeg = "0.4"
openh264 = "0.6"
webrtc = "0.11"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
