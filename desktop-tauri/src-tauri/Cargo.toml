[package]
name = "app"
version = "0.1.0"
description = "Topics — low-footprint desktop shell (Tauri)"
authors = ["Armonia <hi@armonia.io>"]
license = "MIT"
repository = "https://github.com/armonia/topics-app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` unlocks multi-webview (Window::add_child) — the native browser pane:
# a real child WKWebView positioned over the React layout slot, like Electron's
# WebContentsView (vs the laggy WS screencast). See src/lib.rs browser_* commands.
tauri = { version = "2.11.3", features = ["macos-private-api", "unstable", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
# Native file dialogs (the project folder picker — `selectDirectory` was Electron-only).
tauri-plugin-dialog = "2"
# Native OS notifications: the completion/idle toasts use the web Notification API,
# which is unreliable in a WKWebView shell — route them through the plugin on Tauri.
tauri-plugin-notification = "2"
# Remember window size/position/maximized across launches (Electron persisted its
# bounds; a bare Tauri window always reopens at the default size + centre).
tauri-plugin-window-state = "2"
# Single-instance lock: a second launch (launchd KeepAlive, double-click) must not
# spawn a duplicate that fails to bind the proxy port — instead it focuses the
# running window. Registered FIRST in the builder (plugin requirement).
tauri-plugin-single-instance = "2"
sysinfo = "0.33"
# Loopback TLS-origination proxy: the WKWebView talks plain HTTP/WS to a local
# port; this re-originates TLS to the data server (whose local-CA cert WKWebView
# won't trust). tokio comes via tauri's async runtime.
tokio = { version = "1", features = ["net", "io-util", "rt"] }
tokio-native-tls = "0.3"
native-tls = "0.2"

# macOS-only: toggle the native traffic-light buttons (close/min/zoom) so they
# stay hidden by default and reveal only when the Topics menu opens — matching
# the Electron shell's `setWindowButtonVisibility`. Tauri has no JS API for this,
# so we reach the NSWindow's standardWindowButton(_:) directly.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
