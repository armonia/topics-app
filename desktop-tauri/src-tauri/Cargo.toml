[package]
name = "app"
version = "2.2.214"
description = "Topics — low-footprint desktop shell (Tauri)"
authors = ["Armonia <hi@armonia.io>"]
license = "MIT"
repository = "https://github.com/armonia/topics-app"
edition = "2021"
# 1.80 e non 1.77.2: `std::sync::LazyLock` (src/lib.rs:6573, due usi) e
# stabilizzata in 1.80.0, quindi su 1.77.2 questo crate NON COMPILA — la
# soglia dichiarata era una promessa che il codice non manteneva. Non si
# vedeva perche i workflow usano `dtolnay/rust-toolchain@stable` e nessuno
# builda mai sul minimo. Lo dice `cargo clippy` (lint `incompatible_msrv`),
# che confronta ogni chiamata con QUESTO numero: tenerlo onesto e cio che
# rende utile il lint.
rust-version = "1.80.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Release profile tuned for a low-footprint shell: fat LTO + single codegen unit
# maximise cross-crate optimisation (this ships infrequently, from CI, so the
# longer link is fine), and `strip` drops debug symbols for a smaller binary.
# opt-level stays at the release default (3) — this is an IPC/UI shell, but there
# is no reason to trade away runtime speed. `panic` is deliberately left at the
# default `unwind`: the `no_abort`/`catch_unwind` machinery that guards the
# WKURLSchemeHandler + IPC FFI boundaries against poisoned-mutex SIGABRTs REQUIRES
# unwinding — `panic = "abort"` would silently defeat it. Do not add it.
[profile.release]
codegen-units = 1
lto = true
strip = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` unlocks multi-webview (Window::add_child) — the native browser pane:
# a real child WKWebView positioned over the React layout slot, like Electron's
# WebContentsView (vs the laggy WS screencast). See src/lib.rs browser_* commands.
tauri = { version = "2.11.3", features = ["macos-private-api", "unstable", "tray-icon", "image-png", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Sidecar management: on a machine with no external launchd server, the shell
# spawns the bundled `topics-server` sidecar (a `bun build --compile` binary,
# registered in tauri.conf bundle.externalBin) and owns its lifecycle — spawn on
# boot, kill on app exit. The plugin resolves the platform-triple-suffixed binary
# next to the app executable and gives a killable CommandChild.
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
# Native file dialogs (the project folder picker — `selectDirectory` was Electron-only).
tauri-plugin-dialog = "2"
# Native OS notifications: the completion/idle toasts use the web Notification API,
# which is unreliable in a WKWebView shell — route them through the plugin on Tauri.
tauri-plugin-notification = "2"
# Auto-update (parity with the Electron updater). Activates once a signed tauri-v*
# release is published + the endpoint serves its latest.json; inert otherwise.
tauri-plugin-updater = "2"
# Single-instance lock: a second launch (launchd KeepAlive, double-click) must not
# spawn a duplicate that fails to bind the proxy port — instead it focuses the
# running window. Registered FIRST in the builder (plugin requirement).
tauri-plugin-single-instance = "2"
# Global hotkey (Electron-parity): Cmd/Ctrl+Alt+T toggles always-on-top.
tauri-plugin-global-shortcut = "2"
# "Open at Login" (Electron parity: app.setLoginItemSettings). Menu toggle.
tauri-plugin-autostart = "2"
sysinfo = "0.33"
# Loopback TLS-origination proxy: the WKWebView talks plain HTTP/WS to a local
# port; this re-originates TLS to the data server (whose local-CA cert WKWebView
# won't trust). tokio comes via tauri's async runtime.
tokio = { version = "1", features = ["net", "io-util", "rt"] }
tokio-native-tls = "0.3"
native-tls = "0.2"

# Windows: il pane browser nativo parla a WebView2 attraverso il controller che
# Tauri espone (`PlatformWebview::controller`). Le versioni NON sono libere:
# devono essere le stesse che risolve wry, altrimenti cargo compila due copie
# della crate e i tipi, pur chiamandosi uguale, non unificano: l'errore che si
# ottiene e «expected ICoreWebView2Controller, found ICoreWebView2Controller»,
# che e fra i piu difficili da leggere. Il riferimento e Cargo.lock, non crates.io.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# `Win32_UI_Input_KeyboardAndMouse` is the accelerator hooks' other half
# (`menu_chords_win.rs` for the menu chords, `chords_win.rs` for the app ones):
# the WebView2 event says WHICH key was pressed and never which modifiers were
# down, so those come from `GetKeyState`, and the character an OEM key prints on
# the active layout from `MapVirtualKeyW`.
#
# `Win32_UI_WindowsAndMessaging` is `SetWindowPos`, and it has exactly one caller:
# `windows_repaint.rs` puts the rebuilt main webview back under its sibling
# panes. The feature is declared here rather than inherited from wry, which
# happens to enable it: cargo unifies features, so the build would compile
# either way, and a call that depends on somebody else's feature list breaks the
# day they drop it.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Linux e i BSD: stessa storia, ma con WebKitGTK. `cairo-rs` arriva gia da gtk,
# qui si aggiunge solo la feature `png`, che serve a `write_to_png` per lo
# screenshot e che nessuno nella catena accende. `javascriptcore-rs` e il tipo
# del valore che torna da `evaluate_javascript` (webkit2gtk lo importa col nome
# `java_script_core` ma non lo ri-esporta, quindi va dichiarato qui).
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = "=1.1.2"
cairo-rs = { version = "0.18", features = ["png"] }
glib = "0.18"
gio = "0.18"
soup3 = "0.5"

# macOS-only: toggle the native traffic-light buttons (close/min/zoom) so they
# stay hidden by default and reveal only when the Topics menu opens — matching
# the Electron shell's `setWindowButtonVisibility`. Tauri has no JS API for this,
# so we reach the NSWindow's standardWindowButton(_:) directly.
[target.'cfg(target_os = "macos")'.dependencies]
# Native banner delivery via the modern UserNotifications framework. The plugin
# path (tauri-plugin-notification → notify-rust → mac-notification-sys) posts
# through the DEPRECATED NSUserNotificationCenter, which macOS 26's usernoted
# refuses outright ("no notification allowed to be sent to it") — banners were
# silently dropped and the app never appeared in Settings → Notifications. We
# post UNNotificationRequests ourselves and request authorization at setup.
# Versions pin the objc2 stack already in the tree (transitive from tauri/wry).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString", "NSError", "NSData", "NSArray", "NSSet", "NSEnumerator"] }
block2 = "0.6"
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotification",
    "UNNotificationResponse",
    "UNNotificationSettings",
    # I TASTI del banner: una `UNNotificationCategory` porta le `UNNotificationAction`,
    # e il click torna dal delegate come `actionIdentifier`. Senza queste due, una
    # notifica può solo essere aperta — che è esattamente com'era.
    "UNNotificationAction",
    "UNNotificationCategory",
    "block2",
] }
