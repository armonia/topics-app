[package]
name = "app"
version = "0.1.0"
description = "Topics — low-footprint desktop shell (Tauri)"
authors = ["Armonia <hi@armonia.io>"]
license = "MIT"
repository = "https://github.com/armonia/topics-app"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
sysinfo = "0.33"
# Loopback TLS-origination proxy: the WKWebView talks plain HTTP/WS to a local
# port; this re-originates TLS to the data server (whose local-CA cert WKWebView
# won't trust). tokio comes via tauri's async runtime.
tokio = { version = "1", features = ["net", "io-util", "rt"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
