<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="monospace,sans-serif" font-size="13">
  <!-- Background -->
  <rect width="900" height="480" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">Promemoria anteprima: prima e dopo</text>

  <!-- PRIMA column -->
  <rect x="20" y="55" width="420" height="390" rx="8" fill="#1e1e3a" stroke="#555" stroke-width="1.5"/>
  <text x="230" y="80" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">PRIMA</text>

  <!-- Agent node -->
  <rect x="160" y="95" width="140" height="38" rx="6" fill="#2d4a7a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="230" y="117" text-anchor="middle" fill="#90c8ff">agente dispatchato</text>

  <!-- Arrow down to promoteReviewPreview -->
  <line x1="230" y1="133" x2="230" y2="163" stroke="#777" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- promoteReviewPreview box -->
  <rect x="100" y="163" width="260" height="38" rx="6" fill="#2a3a2a" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="230" y="182" text-anchor="middle" fill="#90d090" font-size="12">promoteReviewPreview</text>
  <text x="230" y="196" text-anchor="middle" fill="#90d090" font-size="11">(nessun allegato)</text>

  <!-- Arrow to thread -->
  <line x1="230" y1="201" x2="230" y2="235" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrf)"/>

  <!-- Thread (human) -->
  <rect x="90" y="235" width="280" height="80" rx="6" fill="#3a1a1a" stroke="#cc4444" stroke-width="1.5"/>
  <text x="230" y="255" text-anchor="middle" fill="#ff9090" font-size="12" font-weight="bold">Thread dell'umano</text>
  <text x="230" y="272" text-anchor="middle" fill="#ffaaaa" font-size="11">review-note: «Consegna SENZA</text>
  <text x="230" y="287" text-anchor="middle" fill="#ffaaaa" font-size="11">anteprima... .png .webm .svg</text>
  <text x="230" y="302" text-anchor="middle" fill="#ffaaaa" font-size="11">update_task(preview_image=...)»</text>

  <!-- Human figure -->
  <circle cx="230" cy="353" r="16" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="230" y="358" text-anchor="middle" fill="#888" font-size="11">umano</text>
  <text x="230" y="375" text-anchor="middle" fill="#cc4444" font-size="10">non puo' eseguire</text>
  <text x="230" y="389" text-anchor="middle" fill="#cc4444" font-size="10">le istruzioni</text>

  <!-- DOPO column -->
  <rect x="460" y="55" width="420" height="390" rx="8" fill="#1e1e3a" stroke="#555" stroke-width="1.5"/>
  <text x="670" y="80" text-anchor="middle" fill="#4aff6b" font-size="14" font-weight="bold">DOPO</text>

  <!-- buildKickoff / buildResume box -->
  <rect x="540" y="95" width="260" height="50" rx="6" fill="#2a3a5a" stroke="#4a70d9" stroke-width="1.5"/>
  <text x="670" y="116" text-anchor="middle" fill="#90b8ff" font-size="12" font-weight="bold">buildKickoff / buildResume</text>
  <text x="670" y="133" text-anchor="middle" fill="#90b8ff" font-size="11">PREVIEW_RULE (shared/board.ts)</text>

  <!-- Arrow to agent -->
  <line x1="670" y1="145" x2="670" y2="175" stroke="#4aff6b" stroke-width="2" marker-end="url(#arrg)"/>

  <!-- Agent reads envelope -->
  <rect x="560" y="175" width="220" height="50" rx="6" fill="#2d4a7a" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="670" y="196" text-anchor="middle" fill="#90c8ff" font-size="12">agente legge l'envelope</text>
  <text x="670" y="212" text-anchor="middle" fill="#90c8ff" font-size="11">PRIMA di consegnare</text>

  <!-- Arrow to review -->
  <line x1="670" y1="225" x2="670" y2="260" stroke="#777" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- promoteReviewPreview (dopo) -->
  <rect x="540" y="260" width="260" height="38" rx="6" fill="#2a3a2a" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="670" y="279" text-anchor="middle" fill="#90d090" font-size="12">promoteReviewPreview</text>
  <text x="670" y="293" text-anchor="middle" fill="#90d090" font-size="11">(nessun allegato: silenzio)</text>

  <!-- Arrow to thread (thin, silent) -->
  <line x1="670" y1="298" x2="670" y2="332" stroke="#555" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrd)"/>

  <!-- Thread (human, clean) -->
  <rect x="540" y="332" width="260" height="55" rx="6" fill="#1a2a1a" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="670" y="352" text-anchor="middle" fill="#90d090" font-size="12" font-weight="bold">Thread dell'umano</text>
  <text x="670" y="369" text-anchor="middle" fill="#8ab08a" font-size="11">nessuna nota istruttiva</text>
  <text x="670" y="384" text-anchor="middle" fill="#8ab08a" font-size="11">riquadro vuoto = fatto evidente</text>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#777"/>
    </marker>
    <marker id="arrf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4aff6b"/>
    </marker>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Legend -->
  <line x1="20" y1="458" x2="50" y2="458" stroke="#ff6b6b" stroke-width="2"/>
  <text x="57" y="462" fill="#cc8888" font-size="11">istruzioni al posto sbagliato</text>
  <line x1="300" y1="458" x2="330" y2="458" stroke="#4aff6b" stroke-width="2"/>
  <text x="337" y="462" fill="#88cc88" font-size="11">istruzioni nell'envelope dell'agente</text>
  <line x1="620" y1="458" x2="650" y2="458" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="657" y="462" fill="#777" font-size="11">thread silenzioso</text>
</svg>
