<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" font-family="system-ui,sans-serif">
  <!-- Background -->
  <rect width="800" height="380" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#f0f0f0" font-size="16" font-weight="bold">board_land: prima vs dopo il fix</text>

  <!-- PRIMA column -->
  <text x="170" y="72" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">PRIMA (bugiardo)</text>

  <!-- POST /land box -->
  <rect x="60" y="85" width="220" height="44" rx="6" fill="#1e2130" stroke="#4b5563" stroke-width="1"/>
  <text x="170" y="107" text-anchor="middle" fill="#9ca3af" font-size="11">1. POST /land</text>
  <text x="170" y="122" text-anchor="middle" fill="#6b7280" font-size="10">risponde 200 con card</text>

  <!-- Arrow down -->
  <line x1="170" y1="129" x2="170" y2="155" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MCP returns immediately -->
  <rect x="60" y="155" width="220" height="44" rx="6" fill="#2d1515" stroke="#ef4444" stroke-width="1.5"/>
  <text x="170" y="177" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">2. MCP ritorna «landed»</text>
  <text x="170" y="192" text-anchor="middle" fill="#ef4444" font-size="10">senza aspettare il merge</text>

  <!-- Arrow down -->
  <line x1="170" y1="199" x2="170" y2="225" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Async merge fails -->
  <rect x="60" y="225" width="220" height="44" rx="6" fill="#1e2130" stroke="#4b5563" stroke-width="1"/>
  <text x="170" y="247" text-anchor="middle" fill="#9ca3af" font-size="11">3. Merge asincrono...</text>
  <text x="170" y="262" text-anchor="middle" fill="#ef4444" font-size="10">RIFIUTATO (checkout sporco)</text>

  <!-- Thread writes truth but tool already lied -->
  <rect x="60" y="290" width="220" height="50" rx="6" fill="#1a1a2e" stroke="#6b7280" stroke-width="1"/>
  <text x="170" y="310" text-anchor="middle" fill="#6b7280" font-size="10">Thread card: «Land NON riuscito»</text>
  <text x="170" y="325" text-anchor="middle" fill="#6b7280" font-size="10">Ma il tool aveva gia' detto</text>
  <text x="170" y="340" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">«landed» 3 volte il 18/08</text>

  <!-- DIVIDER -->
  <line x1="400" y1="65" x2="400" y2="360" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- DOPO column -->
  <text x="610" y="72" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">DOPO (onesto)</text>

  <!-- POST /land -->
  <rect x="490" y="85" width="240" height="44" rx="6" fill="#1e2130" stroke="#4b5563" stroke-width="1"/>
  <text x="610" y="107" text-anchor="middle" fill="#9ca3af" font-size="11">1. POST /land → 202 (accodato)</text>
  <text x="610" y="122" text-anchor="middle" fill="#6b7280" font-size="10">ticket con phase: queued</text>

  <!-- Arrow down -->
  <line x1="610" y1="129" x2="610" y2="155" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Poll GET /land -->
  <rect x="490" y="155" width="240" height="44" rx="6" fill="#1e2130" stroke="#4b5563" stroke-width="1"/>
  <text x="610" y="177" text-anchor="middle" fill="#9ca3af" font-size="11">2. Poll GET /land (~2s × 45)</text>
  <text x="610" y="192" text-anchor="middle" fill="#6b7280" font-size="10">aspetta phase: settled</text>

  <!-- Arrow down -->
  <line x1="610" y1="199" x2="610" y2="225" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Read landingState -->
  <rect x="490" y="225" width="240" height="44" rx="6" fill="#1e2130" stroke="#4b5563" stroke-width="1"/>
  <text x="610" y="247" text-anchor="middle" fill="#9ca3af" font-size="11">3. Legge landingState dal task</text>
  <text x="610" y="262" text-anchor="middle" fill="#6b7280" font-size="10">landed / unlanded / skipped</text>

  <!-- Arrow down -->
  <line x1="610" y1="269" x2="610" y2="290" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Honest response -->
  <rect x="490" y="290" width="240" height="50" rx="6" fill="#0d2015" stroke="#22c55e" stroke-width="1.5"/>
  <text x="610" y="312" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">«LAND RIFIUTATO: checkout sporco.»</text>
  <text x="610" y="327" text-anchor="middle" fill="#86efac" font-size="10">oppure «Landato su main»</text>
  <text x="610" y="342" text-anchor="middle" fill="#22c55e" font-size="10">solo quando e' vero</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
