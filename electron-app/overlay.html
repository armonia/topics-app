<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:;">
<title>Overlay</title>
<style>
  /* Phase 30.1 polish — overlay window for dropdowns/menus rendered above
     OS-level WebContentsView. Vanilla DOM, no React. ~3KB total payload.
     CSS vars are injected at runtime via JS from the parent app's theme,
     so the overlay always matches the active app theme (light/dark/custom). */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    -webkit-app-region: no-drag;
    user-select: none;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    color: var(--ovl-text, #1f2937);
  }
  /* Outer wrapper anchors the panel to (0,0) of the overlay window so
     window dimensions == panel dimensions. */
  /* Frame tokens mirror lib/popoverStyles.ts POPOVER_SURFACE: 8px radius
     (rounded-lg), hairline border, and Tailwind's `shadow-lg` so the native
     menu matches the in-app React popovers pixel-for-pixel. The bg is the
     themed (opaque) --bg-surface passed from the app — see overlayThemeColors(). */
  #panel {
    position: fixed;
    top: 0;
    left: 0;
    background: var(--ovl-bg, rgba(255,255,255,0.85));
    /* Frost the WebContentsView behind the (transparent) overlay window, so the
       native menu reads like the in-app `.glass-surface` popovers. */
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    backdrop-filter: blur(24px) saturate(1.5);
    border: 1px solid var(--ovl-border, rgba(0,0,0,0.08));
    border-radius: 8px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
    padding: 4px;
    min-width: 160px;
    box-sizing: border-box;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    /* px-3 py-1.5 rhythm of POPOVER_ITEM */
    padding: 6px 12px;
    border: 0;
    background: transparent;
    color: var(--ovl-text, inherit);
    font: inherit;
    text-align: left;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.05s;
  }
  .item:hover { background: var(--ovl-hover, rgba(0,0,0,0.05)); }
  .item .icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ovl-muted, #6b7280);
  }
  .item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .divider {
    height: 1px;
    margin: 4px 6px;
    background: var(--ovl-border, rgba(0,0,0,0.08));
  }
</style>
</head>
<body>
<div id="panel" role="menu"></div>
<script src="./overlay-renderer.js"></script>
</body>
</html>
