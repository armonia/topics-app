<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icons/icon-180.png" />
    <!-- ZOOM STAYS POSSIBLE. `maximum-scale=1.0, user-scalable=no` was here with
         no line explaining it: it is the recipe copied everywhere against the
         double-tap that zooms by accident on iOS. But it also kills pinch, which
         is the only way someone with poor eyesight can read this app on a phone.
         axe-core flags it as CRITICAL ("Zooming and scaling must not be
         disabled"), and it is right: it is a convenience of ours paid for by
         somebody else.
         As for accidental zoom, iOS stopped doing it on its own: since 10 the
         double-tap only zooms where text is too small, and our UI already carries
         the `font-size: 16px` on inputs that was the real cause of the zoom-on-
         focus. With the ban gone, the initial scale remains — which is what was
         actually wanted. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content, viewport-fit=cover" />
    <meta name="theme-color" content="#eaecf0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-180.png" />
    <!-- `black` (opaque), NOT `black-translucent`: on iOS standalone PWAs,
         black-translucent makes the webview full-screen at the top (content under
         the Dynamic Island) but leaves the layout viewport ~topInset px SHORT at
         the BOTTOM (innerHeight = screen − topInset), so a band of webview
         background shows below the content and can't be filled from inside the
         page. `black` insets the viewport BELOW an opaque status bar and fills
         all the way to the bottom edge.

         Seen on a real iPhone on 08/06 (bc92725d7). On 01/10 it was flipped to
         `black-translucent` so content could run under the status bar too, and
         put back the same day: that was never tried on a phone, the app root is
         `position: fixed; bottom: 0`, so a short viewport would lift the button
         row ~47-62px off the glass (its corners no longer on the screen's curve),
         and the translucent bar forces a WHITE clock and battery over the light
         chrome. Under `black` the bottom safe area is ours (`viewport-fit=cover`,
         the scrollers' trailing spacer, the button row); the top one belongs to
         the status bar. Flip it only after reading `innerHeight` against
         `screen.height` in standalone on a device. -->
    <!-- TEST BUILD (branch test/safe-area-translucent-1001, never merge as is):
         `black-translucent` to try, on the phone, content under the status
         bar. The two known costs of the comment above are answered here, not
         assumed away: the short viewport by the root's screen floor
         (useStandaloneScreenFloor) and the forced WHITE clock by a dark
         translucent scrim under the status bar (`html::before` below), in both
         themes. The numbers to read off the phone are in ViewportProbe. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Topics" />
    <link rel="manifest" href="/manifest.json" />
    <title>Topics</title>
    <!-- Pre-paint boot (theme/FOUC, SW register, CSP telemetry). Externalized to
         /boot.js so a strict `script-src 'self'` CSP doesn't refuse it (inline
         <script> would be blocked under that policy). Blocking + in <head> so it
         still runs before first paint. See client/public/boot.js. -->
    <script src="/boot.js"></script>
    <style>
      /* Critical CSS — must match React theme colors exactly */
      /* Il CHROME (#eaecf0 / #080a0e), non la pagina: questo fondo si vede solo dove
         non dipinge nient'altro — cioè il bordo dell'app e la fascia della
         safe-area — e quel bordo deve leggersi come la sidebar. Tenere in
         lockstep con --chrome-bg in index.css e con boot.js. */
      html, body, #root { background-color: #eaecf0; color: #1a1a1a; }
      html.dark, html.dark body, html.dark #root { background-color: #080a0e; color: #e6edf3; }
      /* Native frosted backdrop (macOS vibrancy / Windows acrylic): stay
         transparent pre-paint so the native backdrop isn't masked. `native-frost`
         is added by /boot.js above, before this style can paint. */
      html.native-frost, html.native-frost body, html.native-frost #root { background-color: transparent; }
      /* TEST BUILD: under `black-translucent` iOS paints the clock and battery
         WHITE whatever the theme, and the light chrome (#eaecf0) makes them
         unreadable. A dark veil exactly as tall as the status bar keeps them
         legible; translucent + blurred, so what scrolls under it (the sidebar
         list) still shows through. In the dark theme it sits on #080a0e and
         barely shows. Standalone only: in a browser tab the inset is 0. */
      @media (display-mode: standalone) {
        html::before {
          content: ""; position: fixed; top: 0; left: 0; right: 0;
          height: env(safe-area-inset-top, 0px);
          background: rgba(8, 10, 14, 0.55);
          -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
          z-index: 2147483647; pointer-events: none;
        }
      }
      /* Hide sidebar instantly when pre-collapsed to avoid flash */
      html.sidebar-pre-collapsed [role="navigation"][aria-label="Topics sidebar"] { width: 0 !important; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
