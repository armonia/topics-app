<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Topics" />
    <link rel="manifest" href="/manifest.json" />
    <title>Topics</title>
    <script>
      // Apply theme + sidebar state BEFORE first paint to prevent FOUC/flicker
      (function() {
        var theme = 'system';
        try { theme = localStorage.getItem('theme') || 'system'; } catch(e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');

        // Pre-apply sidebar collapsed state
        try {
          var settings = JSON.parse(localStorage.getItem('app-settings') || '{}');
          if (settings.sidebarCollapsed) document.documentElement.classList.add('sidebar-pre-collapsed');
        } catch(e) {}
      })();
    </script>
    <style>
      /* Critical CSS — must match React theme colors exactly */
      html, body, #root { background-color: #f8f9fa; color: #1a1a1a; }
      html.dark, html.dark body, html.dark #root { background-color: #1a1a1a; color: #e6edf3; }
      /* Hide sidebar instantly when pre-collapsed to avoid flash */
      html.sidebar-pre-collapsed [role="navigation"][aria-label="Topics sidebar"] { width: 0 !important; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA (only on localhost or cloudflare tunnels)
      if ('serviceWorker' in navigator) {
        const host = window.location.hostname;
        const shouldRegisterSW = host === 'localhost' || host.endsWith('.trycloudflare.com');
        
        window.addEventListener('load', () => {
          if (shouldRegisterSW) {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('SW registered:', reg.scope))
              .catch(err => console.warn('SW registration failed:', err));
          } else {
            // Unregister any existing SW for LAN access
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(reg => reg.unregister());
            });
          }
        });
      }
    </script>
  </body>
</html>
