<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0066ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Topics" />
    <link rel="manifest" href="/manifest.json" />
    <title>Topics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA (only on localhost or cloudflare tunnels)
      if ('serviceWorker' in navigator) {
        const host = window.location.hostname;
        const shouldRegisterSW = host === 'localhost' || host.endsWith('.trycloudflare.com');
        
        window.addEventListener('load', () => {
          if (shouldRegisterSW) {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('SW registered:', reg.scope))
              .catch(err => console.warn('SW registration failed:', err));
          } else {
            // Unregister any existing SW for LAN access
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(reg => reg.unregister());
            });
          }
        });
      }
    </script>
  </body>
</html>
