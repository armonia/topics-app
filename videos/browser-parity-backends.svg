<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="640" fill="#12141a"/>

  <text x="40" y="60" fill="#e8eaf0" font-size="46" font-weight="700">Un contratto, tre motori</text>

  <!-- Top: the command surface -->
  <rect x="40" y="90" width="880" height="78" rx="10" fill="#1e2230" stroke="#3a4055" stroke-width="2"/>
  <text x="480" y="128" fill="#e8eaf0" font-size="34" font-weight="600" text-anchor="middle">23 op agent su 3 primitive</text>
  <text x="480" y="157" fill="#8f97ab" font-size="26" text-anchor="middle">eval · screenshot · cookie</text>

  <!-- Shared layer -->
  <line x1="480" y1="168" x2="480" y2="200" stroke="#4a5168" stroke-width="3"/>
  <rect x="150" y="200" width="660" height="84" rx="10" fill="#1b2a24" stroke="#3f6b55" stroke-width="2"/>
  <text x="480" y="238" fill="#7fd6a6" font-size="32" font-weight="700" text-anchor="middle">browser_eval: logica condivisa</text>
  <text x="480" y="269" fill="#8fae9e" font-size="25" text-anchor="middle">attende le promise · 10 test verdi</text>

  <!-- fan-out lines -->
  <line x1="480" y1="284" x2="480" y2="308" stroke="#4a5168" stroke-width="3"/>
  <line x1="175" y1="308" x2="785" y2="308" stroke="#4a5168" stroke-width="3"/>
  <line x1="175" y1="308" x2="175" y2="342" stroke="#4a5168" stroke-width="3"/>
  <line x1="480" y1="308" x2="480" y2="342" stroke="#4a5168" stroke-width="3"/>
  <line x1="785" y1="308" x2="785" y2="342" stroke="#4a5168" stroke-width="3"/>

  <!-- macOS -->
  <rect x="40" y="342" width="270" height="222" rx="10" fill="#1e2230" stroke="#3a4055" stroke-width="2"/>
  <text x="175" y="384" fill="#e8eaf0" font-size="36" font-weight="700" text-anchor="middle">macOS</text>
  <text x="175" y="414" fill="#8f97ab" font-size="26" text-anchor="middle">WKWebView</text>
  <rect x="62" y="432" width="226" height="42" rx="6" fill="#1d4030"/>
  <text x="175" y="461" fill="#7fd6a6" font-size="28" font-weight="600" text-anchor="middle">invariato</text>
  <text x="175" y="507" fill="#8f97ab" font-size="25" text-anchor="middle">il riferimento</text>
  <text x="175" y="537" fill="#8f97ab" font-size="25" text-anchor="middle">di parità</text>

  <!-- Windows -->
  <rect x="345" y="342" width="270" height="222" rx="10" fill="#1e2230" stroke="#4a7fb5" stroke-width="2"/>
  <text x="480" y="384" fill="#e8eaf0" font-size="36" font-weight="700" text-anchor="middle">Windows</text>
  <text x="480" y="414" fill="#8f97ab" font-size="26" text-anchor="middle">WebView2</text>
  <rect x="367" y="432" width="226" height="42" rx="6" fill="#1a3550"/>
  <text x="480" y="461" fill="#8ec5ff" font-size="28" font-weight="600" text-anchor="middle">nuovo</text>
  <text x="480" y="507" fill="#8f97ab" font-size="25" text-anchor="middle">compila verde</text>
  <text x="480" y="537" fill="#c08a5a" font-size="25" text-anchor="middle">no cronologia</text>

  <!-- Linux -->
  <rect x="650" y="342" width="270" height="222" rx="10" fill="#1e2230" stroke="#4a7fb5" stroke-width="2"/>
  <text x="785" y="384" fill="#e8eaf0" font-size="36" font-weight="700" text-anchor="middle">Linux</text>
  <text x="785" y="414" fill="#8f97ab" font-size="26" text-anchor="middle">WebKitGTK</text>
  <rect x="672" y="432" width="226" height="42" rx="6" fill="#1a3550"/>
  <text x="785" y="461" fill="#8ec5ff" font-size="28" font-weight="600" text-anchor="middle">nuovo</text>
  <text x="785" y="507" fill="#8f97ab" font-size="25" text-anchor="middle">compila verde</text>
  <text x="785" y="537" fill="#c08a5a" font-size="25" text-anchor="middle">cookie del sito</text>

  <!-- footer -->
  <text x="40" y="608" fill="#6d748a" font-size="26">Provato a compilazione. Mai girato su quelle due macchine.</text>
</svg>
