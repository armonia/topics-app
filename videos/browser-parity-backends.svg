<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#12141a"/>

  <text x="40" y="58" fill="#e8eaf0" font-size="42" font-weight="700">browser_*: un contratto, tre motori</text>

  <!-- Top: the command surface -->
  <rect x="40" y="88" width="880" height="72" rx="10" fill="#1e2230" stroke="#3a4055" stroke-width="2"/>
  <text x="480" y="124" fill="#e8eaf0" font-size="33" font-weight="600" text-anchor="middle">26 comandi Tauri · 23 op agent</text>
  <text x="480" y="150" fill="#8f97ab" font-size="22" text-anchor="middle">eval · screenshot · cookie · nav · download</text>

  <!-- Shared layer -->
  <line x1="480" y1="160" x2="480" y2="192" stroke="#4a5168" stroke-width="3"/>
  <rect x="180" y="192" width="600" height="80" rx="10" fill="#1b2a24" stroke="#3f6b55" stroke-width="2"/>
  <text x="480" y="226" fill="#7fd6a6" font-size="30" font-weight="700" text-anchor="middle">browser_eval: logica condivisa</text>
  <text x="480" y="254" fill="#8fae9e" font-size="21" text-anchor="middle">attende le promise · normalizza il risultato · 10 test verdi</text>

  <!-- fan-out lines -->
  <line x1="480" y1="272" x2="480" y2="296" stroke="#4a5168" stroke-width="3"/>
  <line x1="175" y1="296" x2="785" y2="296" stroke="#4a5168" stroke-width="3"/>
  <line x1="175" y1="296" x2="175" y2="330" stroke="#4a5168" stroke-width="3"/>
  <line x1="480" y1="296" x2="480" y2="330" stroke="#4a5168" stroke-width="3"/>
  <line x1="785" y1="296" x2="785" y2="330" stroke="#4a5168" stroke-width="3"/>

  <!-- macOS -->
  <rect x="40" y="330" width="270" height="220" rx="10" fill="#1e2230" stroke="#3a4055" stroke-width="2"/>
  <text x="175" y="368" fill="#e8eaf0" font-size="33" font-weight="700" text-anchor="middle">macOS</text>
  <text x="175" y="394" fill="#8f97ab" font-size="22" text-anchor="middle">WKWebView</text>
  <rect x="66" y="414" width="218" height="38" rx="6" fill="#1d4030"/>
  <text x="175" y="440" fill="#7fd6a6" font-size="26" font-weight="600" text-anchor="middle">invariato</text>
  <text x="175" y="484" fill="#8f97ab" font-size="20" text-anchor="middle">il riferimento di parità</text>
  <text x="175" y="510" fill="#8f97ab" font-size="20" text-anchor="middle">girava già, gira uguale</text>

  <!-- Windows -->
  <rect x="345" y="330" width="270" height="220" rx="10" fill="#1e2230" stroke="#4a7fb5" stroke-width="2"/>
  <text x="480" y="368" fill="#e8eaf0" font-size="33" font-weight="700" text-anchor="middle">Windows</text>
  <text x="480" y="394" fill="#8f97ab" font-size="22" text-anchor="middle">WebView2</text>
  <rect x="371" y="414" width="218" height="38" rx="6" fill="#1a3550"/>
  <text x="480" y="440" fill="#8ec5ff" font-size="26" font-weight="600" text-anchor="middle">nuovo · compila</text>
  <text x="480" y="484" fill="#8f97ab" font-size="20" text-anchor="middle">eval, screenshot, cookie</text>
  <text x="480" y="510" fill="#c08a5a" font-size="20" text-anchor="middle">manca la lista cronologia</text>

  <!-- Linux -->
  <rect x="650" y="330" width="270" height="220" rx="10" fill="#1e2230" stroke="#4a7fb5" stroke-width="2"/>
  <text x="785" y="368" fill="#e8eaf0" font-size="33" font-weight="700" text-anchor="middle">Linux</text>
  <text x="785" y="394" fill="#8f97ab" font-size="22" text-anchor="middle">WebKitGTK</text>
  <rect x="676" y="414" width="218" height="38" rx="6" fill="#1a3550"/>
  <text x="785" y="440" fill="#8ec5ff" font-size="26" font-weight="600" text-anchor="middle">nuovo · compila</text>
  <text x="785" y="484" fill="#8f97ab" font-size="20" text-anchor="middle">più nav completa</text>
  <text x="785" y="510" fill="#c08a5a" font-size="20" text-anchor="middle">cookie solo del sito</text>

  <!-- footer -->
  <text x="40" y="592" fill="#6d748a" font-size="21">Verificato a compilazione (Win + Linux). Nessun run reale su quelle due macchine.</text>
</svg>
