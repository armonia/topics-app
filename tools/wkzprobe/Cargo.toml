[package]
name = "wkzprobe"
version = "0.1.0"
edition = "2021"
publish = false

# Pinned to the versions desktop-tauri/src-tauri/Cargo.lock resolves, so the
# probe measures the same wry and tao the shell ships. Cargo.lock is committed
# for the transitive ones: move these pins together with the shell's.
[dependencies]
tao = "=0.35.3"
wry = "=0.55.1"

# Same crate and feature set the shell's `browser_win.rs` is built against, so
# the raise the probe issues is the production call. Pinned to what
# desktop-tauri/src-tauri/Cargo.lock resolves for `windows = "0.61"`.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Il terzo backend: GTK. Le versioni sono quelle che wry 0.55.1 risolve, cosi'
# la sonda parla con lo stesso GTK del guscio invece che con uno suo.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# 0.18.2 e' quello che desktop-tauri/src-tauri/Cargo.lock risolve per la shell:
# la sonda deve parlare con lo stesso GTK, non con uno suo.
gtk = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["std", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "=0.3.2", features = ["std", "NSArray", "NSGeometry"] }

[profile.release]
opt-level = 1
