[package]
name = "wkzprobe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tao = "0.34"
wry = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3", features = ["std", "NSArray", "NSGeometry"] }

[profile.release]
opt-level = 1
