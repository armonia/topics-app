    Numeri: prefix-ladder.ts, opus-5[1m] (il modello di produzione), HOME reale,
    CLI 2.1.227, rumore di fondo 0-4 token. PRIMA = produzione di oggi, cioe' il
    prefisso col catalogo skill gia' ai soli nomi: 34.845 - 4.281 = 30.564.
    Scala della barra: 880px / 30.564 token.
  -->
  <rect width="1000" height="500" fill="#0f1115"/>

  <text x="40" y="62" fill="#e7e9ee" font-size="40" font-weight="700">Il prefisso, voce per voce</text>
