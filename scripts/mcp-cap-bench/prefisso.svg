<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif">
  <!--
    Il cancello dell'anteprima e' a 268px di larghezza: la scala e' 0,268, quindi
    ogni testo che deve restare leggibile sta a >=30px qui dentro (>=8px la').
